# 构建安卓 APK（Capacitor 壳 + frontend 的构建产物）
#
# 为什么要放在 CI 上编译：本机要出 APK 得装 JDK + Android SDK（2~3 GB），
# 而 GitHub 的 runner **预装了 Android SDK**，编完直接把 APK 作为产物给你下载。
# 这样手机端就是"下载一个安装包装上就用"，不需要同 WiFi、不需要联网。
#
# 工作方式（也就是 mobile-shell/capacitor.config.json 里的机制）：
#   1. frontend 用 capacitor 模式构建 → dist-app/
#      （base 必须是 / 而不是 /DaChuang-FLCFZ/，否则 WebView 里资源 404、白屏）
#   2. cap sync 把 dist-app/ 拷进 android/app/src/main/assets/public/
#   3. gradle 打出 APK
#
# 触发方式：
#   · 手动（Actions 页面点 Run workflow）
#   · 推 tag（v*）时自动出一版 Release 附件
name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-shell

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Chaquopy 在构建机上需要与 App 相同版本的 Python（3.11）。
      # runner 自带的默认版本不匹配，必须显式装。
      - name: Setup Python 3.11（Chaquopy 需要）
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 不装 android-actions/setup-android：它内部会执行
      #   sdkmanager "tools" ...
      # 而 `tools` 包在较新的 SDK 仓库里已经不存在，实测直接以
      #   Warning: Failed to find package 'tools'
      #   Error: sdkmanager failed with exit code 1
      # 失败（2026-10-15 第一次跑就挂在这一步）。
      # ubuntu-latest runner 本来就预装了 Android SDK（/usr/local/lib/android/sdk），
      # 所以这里只需要把它指出来、并接受许可即可。
      - name: 确认 Android SDK（runner 预装）
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" | head -20
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true

      - name: 构建 frontend（capacitor 模式）
        working-directory: frontend
        run: |
          npm ci
          npm run build:app

      - name: 安装 Capacitor 依赖
        run: npm install --no-audit --no-fund

      # 一次产出两个包，分别对应两种用法：
      #   离线版 —— 内置演示数据，不需要任何后端、不需要联网（发给任何人都能看）
      #   连后端版 —— 指向 frontend/.env.capacitor-live 里的局域网地址，
      #               陪伴对话 / 知识图谱 / 推送这些真功能可用，
      #               但要求手机与电脑同一个 WiFi、且电脑上 8000/8001 都开着
      - name: 打「离线版」APK
        run: |
          cd ../frontend && npm run build:app
          cd ../mobile-shell && npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../心理守护-离线版.apk

      - name: 打「连后端版」APK
        run: |
          cd ../frontend && npm run build:app:live
          cd ../mobile-shell && npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../心理守护-连后端版.apk

      # 第三个包：后端跑在手机里（Chaquopy 打包的 Python + numpy + Pillow）。
      # 与另两个的差别：离线版没有后端；连后端版的后端在电脑上；
      # 这个版本的后端就在本机 127.0.0.1 —— 不需要电脑、不需要 WiFi。
      - name: 打「Chaquopy 版」APK
        run: |
          cd ../frontend && npm run build:app:chaquopy
          cd ../mobile-shell && npx cap sync android
          # -Pchaquopy 打开 Chaquopy；另两个包不带这个参数，
          # 因此不会被塞进 37 MB 用不到的 Python 运行时
          cd android && ./gradlew assembleDebug --no-daemon -Pchaquopy
          cp app/build/outputs/apk/debug/app-debug.apk ../心理守护-Chaquopy版.apk

      - name: 上传三个 APK
        uses: actions/upload-artifact@v4
        with:
          name: psych-screen-apk
          path: |
            mobile-shell/心理守护-离线版.apk
            mobile-shell/心理守护-连后端版.apk
            mobile-shell/心理守护-Chaquopy版.apk
          if-no-files-found: error

      - name: 打 tag 时附到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile-shell/心理守护-*.apk
