# 前端部署：GitHub Pages
# 触发：main 分支 frontend/ 目录变更
# 前置（仓库 Settings）：
#   - Pages → Source 选择 "GitHub Actions"
#   - Variables：VITE_API_BASE_URL（后端 Worker 地址）、VITE_BASE_PATH（如 /DaChuang-FLCFZ/）
name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          # vars 未配置时回退到 .env.production / 内置默认值，避免空字符串覆盖
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://mental-screening-api.787249795.workers.dev' }}
          VITE_USE_MOCK: 'false'
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/DaChuang-FLCFZ/' }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
