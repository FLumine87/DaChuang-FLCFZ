# 项目名固定写死：Compose 默认从目录名推导，而本仓库常被放在中文目录
# （如 E:\心理疾病预测项目）下，推导结果为空会直接报
# "project name must not be empty"，导致 docker compose up 无法启动。
# 写死之后，无论放在哪个目录、叫什么名字，容器名与网络名都稳定为
# psych-screening-backend-1 / psych-screening-frontend-1。
name: psych-screening

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    pull_policy: build
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    environment:
      - DATABASE_URL=sqlite:///./data/dev.db
      - SECRET_KEY=your-secret-key-change-in-production
      - DEBUG=True
      - ENABLE_MOCK_ENGINES=True
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    pull_policy: build
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  uploads_data:
