<text x="130" y="43" fill="#F7F9FF" font-size="21" font-weight="700">心理筛查预警</text><text x="290" y="43" fill="#9BAFEA" font-size="18" font-weight="500">健康管理平台</text>
<text x="1525" y="43" fill="#B8C6E5" font-size="17" font-weight="500" text-anchor="end">首次筛查 · 2/3</text>
<text x="90" y="240" fill="#849AFF" font-size="19" font-weight="600" letter-spacing="3">02  ·  补充记录（可选）</text><text x="90" y="335" fill="#F7F9FF" font-size="60" font-weight="700">让记录更完整，</text><text x="90" y="415" fill="#F7F9FF" font-size="57" font-weight="700">也由你决定分享多少。</text><text x="90" y="510" fill="#AEBBD4" font-size="24" font-weight="400">量表已经完成。你可以补充最近的文字、</text><text x="90" y="548" fill="#AEBBD4" font-size="24" font-weight="400">语音或图片，让分析多一些线索。</text><text x="92" y="650" fill="#6F88FF" font-size="22" font-weight="700">✓</text><text x="128" y="650" fill="#B7C4DF" font-size="19" font-weight="400">不补充也能查看量表结果</text><text x="92" y="698" fill="#6F88FF" font-size="22" font-weight="700">✓</text><text x="128" y="698" fill="#B7C4DF" font-size="19" font-weight="400">提交前先预览内容</text><text x="92" y="746" fill="#6F88FF" font-size="22" font-weight="700">✓</text><text x="128" y="746" fill="#B7C4DF" font-size="19" font-weight="400">这一步可以直接跳过</text><g filter="url(#shadow)"><rect x="800" y="161" width="710" height="718" rx="28" fill="#182235" opacity="1" stroke="#303C58" stroke-width="1.5"/></g><rect x="845" y="205" width="135" height="34" rx="17" fill="#183D3E" opacity="1" stroke="#2F7470" stroke-width="1"/><text x="912" y="228" fill="#95E5CA" font-size="15" font-weight="600" text-anchor="middle">✓  量表已完成</text><text x="845" y="288" fill="#F7F9FF" font-size="30" font-weight="650">想补充些什么？</text><text x="845" y="324" fill="#AEBBD4" font-size="17" font-weight="400">选择一种方式即可，也可以稍后再做。</text><rect x="845" y="360" width="198" height="54" rx="11" fill="#243151" opacity="1" stroke="#465FFF" stroke-width="2"/><text x="863" y="395" fill="#8FA3FF" font-size="22" font-weight="400">✎</text><text x="895" y="394" fill="#F7F9FF" font-size="18" font-weight="600">文字记录</text><rect x="1056" y="360" width="198" height="54" rx="11" fill="#1A263B" opacity="1" stroke="#34415E" stroke-width="1"/><text x="1074" y="395" fill="#AEBBD4" font-size="22" font-weight="400">◉</text><text x="1106" y="394" fill="#AEBBD4" font-size="18" font-weight="400">语音片段</text><rect x="1267" y="360" width="198" height="54" rx="11" fill="#1A263B" opacity="1" stroke="#34415E" stroke-width="1"/><text x="1285" y="395" fill="#AEBBD4" font-size="22" font-weight="400">▧</text><text x="1317" y="394" fill="#AEBBD4" font-size="18" font-weight="400">图片上传</text><rect x="845" y="437" width="620" height="204" rx="15" fill="#121D31" opacity="1" stroke="#34415E" stroke-width="1"/><text x="871" y="478" fill="#8D9DB9" font-size="19" font-weight="400">最近有什么让你在意的事？</text><text x="871" y="512" fill="#71809C" font-size="19" font-weight="400">可以写几句，也可以留空……</text><text x="845" y="680" fill="#8EA1C3" font-size="16" font-weight="400">可选内容；跳过后仍能查看量表结果。</text><rect x="845" y="705" width="620" height="62" rx="12" fill="#465FFF" opacity="1"/><text x="1155.0" y="744.0" fill="#F7F9FF" font-size="22" font-weight="600" text-anchor="middle">提交补充并查看结果</text><rect x="845" y="783" width="620" height="62" rx="12" fill="#172136" opacity="1" stroke="#465FFF" stroke-width="1.5"/><text x="1155.0" y="822.0" fill="#B9C8F4" font-size="22" font-weight="600" text-anchor="middle">跳过补充，查看量表结果</text></svg>