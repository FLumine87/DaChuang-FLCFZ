<text x="1525" y="43" fill="#B8C6E5" font-size="17" font-weight="500" text-anchor="end">首次筛查 · 1/3</text>
<text x="90" y="250" fill="#849AFF" font-size="19" font-weight="600" letter-spacing="3">01  ·  状态筛查</text><text x="90" y="345" fill="#F7F9FF" font-size="60" font-weight="700">从这一题开始，</text><text x="90" y="425" fill="#F7F9FF" font-size="60" font-weight="700">慢慢了解自己。</text><text x="90" y="515" fill="#AEBBD4" font-size="25" font-weight="400">请按照过去两周的真实感受作答。</text><text x="90" y="555" fill="#AEBBD4" font-size="25" font-weight="400">没有标准答案，也不需要着急。</text><circle cx="104" cy="663" r="15" fill="#244177" stroke="#34415E" stroke-width="1"/><text x="104" y="669" fill="#F7F9FF" font-size="16" font-weight="600" text-anchor="middle">✓</text><text x="139" y="670" fill="#AEBBD4" font-size="19" font-weight="400">选择方向</text><text x="285" y="670" fill="#8EA2C9" font-size="15" font-weight="400">已完成</text><line x1="104" y1="682" x2="104" y2="706" stroke="#394969" stroke-width="2"/><circle cx="104" cy="721" r="15" fill="#465FFF" stroke="#465FFF" stroke-width="1"/><text x="104" y="727" fill="#F7F9FF" font-size="16" font-weight="600" text-anchor="middle">2</text><text x="139" y="728" fill="#F7F9FF" font-size="19" font-weight="600">回答问题</text><text x="285" y="728" fill="#8EA2C9" font-size="15" font-weight="400">进行中</text><line x1="104" y1="740" x2="104" y2="764" stroke="#394969" stroke-width="2"/><circle cx="104" cy="779" r="15" fill="#17243D" stroke="#34415E" stroke-width="1"/><text x="104" y="785" fill="#F7F9FF" font-size="16" font-weight="600" text-anchor="middle">3</text><text x="139" y="786" fill="#AEBBD4" font-size="19" font-weight="400">查看结果</text><text x="285" y="786" fill="#8EA2C9" font-size="15" font-weight="400">下一步</text><g filter="url(#shadow)"><rect x="800" y="176" width="710" height="688" rx="28" fill="#182235" opacity="1" stroke="#303C58" stroke-width="1.5"/></g><text x="845" y="230" fill="#F7F9FF" font-size="21" font-weight="600">PHQ-9  情绪筛查</text><text x="1460" y="230" fill="#AEBBD4" font-size="17" font-weight="500" text-anchor="end">第 2 / 9 题</text><rect x="845" y="263" width="620" height="7" rx="4" fill="#293753" opacity="1"/><rect x="845" y="263" width="138" height="7" rx="4" fill="#465FFF" opacity="1"/><text x="845" y="340" fill="#F7F9FF" font-size="31" font-weight="650">感到心情低落、沮丧或绝望</text><text x="845" y="375" fill="#AEBBD4" font-size="17" font-weight="400">在过去两周里，这种感受出现得有多频繁？</text><rect x="845" y="411" width="620" height="62" rx="13" fill="#1A263B" opacity="1" stroke="#34415E" stroke-width="1"/><circle cx="877" cy="442" r="10" fill="#1A263B" stroke="#7E8BA7" stroke-width="2"/><text x="905" y="450" fill="#CBD5E9" font-size="21" font-weight="400">完全不会</text><rect x="845" y="489" width="620" height="62" rx="13" fill="#202B48" opacity="1" stroke="#465FFF" stroke-width="2"/><circle cx="877" cy="520" r="10" fill="#465FFF" stroke="#465FFF" stroke-width="2"/><circle cx="877" cy="520" r="4" fill="#F7F9FF"/><text x="905" y="528" fill="#F7F9FF" font-size="21" font-weight="600">有几天</text><rect x="845" y="567" width="620" height="62" rx="13" fill="#1A263B" opacity="1" stroke="#34415E" stroke-width="1"/><circle cx="877" cy="598" r="10" fill="#1A263B" stroke="#7E8BA7" stroke-width="2"/><text x="905" y="606" fill="#CBD5E9" font-size="21" font-weight="400">超过一半的日子</text><rect x="845" y="645" width="620" height="62" rx="13" fill="#1A263B" opacity="1" stroke="#34415E" stroke-width="1"/><circle cx="877" cy="676" r="10" fill="#1A263B" stroke="#7E8BA7" stroke-width="2"/><text x="905" y="684" fill="#CBD5E9" font-size="21" font-weight="400">几乎每天</text><rect x="845" y="746" width="180" height="62" rx="12" fill="#172136" opacity="1" stroke="#465FFF" stroke-width="1.5"/><text x="935.0" y="785.0" fill="#B9C8F4" font-size="22" font-weight="600" text-anchor="middle">上一题</text><rect x="1043" y="746" width="422" height="62" rx="12" fill="#465FFF" opacity="1"/><text x="1254.0" y="785.0" fill="#F7F9FF" font-size="22" font-weight="600" text-anchor="middle">下一题  →</text><text x="1155" y="844" fill="#8FA2CB" font-size="16" font-weight="400" text-anchor="middle">返