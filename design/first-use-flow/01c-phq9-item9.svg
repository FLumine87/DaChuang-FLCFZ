  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#536484" stroke-opacity="0.12"/></pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="24" stdDeviation="40" flood-color="#020915" flood-opacity="0.28"/></filter>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<rect y="70" width="1600" height="930" fill="url(#grid)" opacity="0.3"/>
<circle cx="1110" cy="500" r="700" fill="url(#glow)"/>
<circle cx="335" cy="530" r="440" fill="none" stroke="#3B58A8" stroke-opacity="0.13"/>
<circle cx="335" cy="530" r="310" fill="none" stroke="#3B58A8" stroke-opacity="0.10"/>
