<text x="130" y="43" fill="#F7F9FF" font-size="21" font-weight="700">心理筛查预警</text><text x="290" y="43" fill="#9BAFEA" font-size="18" font-weight="500">健康管理平台</text><text x="1525" y="43" fill="#B8C6E5" font-size="17" font-weight="500" text-anchor="end">首次筛查 · 1/3</text><text x="90" y="230" fill="#97AAFF" font-size="19" font-weight="600">01 · 状态筛查</text><text x="90" y="326" fill="#F7F9FF" font-size="57" font-weight="700">从这一题开始，</text><text x="90" y="405" fill="#F7F9FF" font-size="57" font-weight="700">慢慢了解自己。</text><text x="90" y="482" fill="#AEBBD4" font-size="24" font-weight="400">请回想过去两周的真实感受。</text><text x="90" y="520" fill="#AEBBD4" font-size="24" font-weight="400">没有标准答案，也不需要着急。</text><rect x="90" y="576" width="615" height="264" rx="22" fill="#14213A" stroke="#2B3D63" stroke-width="1"/><text x="120" y="619" fill="#8295BB" font-size="17" font-weight="500">报告形成方式</text><rect x="120" y="645" width="40" height="40" rx="10" fill="#243252"/><g transform="translate(129 654) scale(0.9166666666666666)" stroke="#97AAFF" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10M7 17L17 7"/><circle cx="5" cy="5" r="3"/><circle cx="19" cy="5" r="3"/><circle cx="5" cy="19" r="3"/><circle cx="19" cy="19" r="3"/></g><text x="178" y="671" fill="#F7F9FF" font-size="22" font-weight="600">动态跨模态哈希检索</text><text x="178" y="705" fill="#AEBBD4" font-size="17" font-weight="400">关联不同模态，检索相近特征模式。</text><rect x="120" y="740" width="40" height="40" rx="10" fill="#243252"/><g transform="translate(129 749) scale(0.9166666666666666)" stroke="#97AAFF" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5C8 2 4 3 2 4v15c3-2 7-2 10 1 3-3 7-3 10-1V4c-2-1-6-2-10 1v15"/></g><text x="178" y="766" fill="#F7F9FF" font-size="22" font-weight="600">RAG 检索增强生成</text><text x="178" y="800" fill="#AEBBD4" font-size="17" font-weight="400">结合参考资料，组织筛查报告。</text><rect x="800" y="160" width="710" height="718" rx="28" fill="#182235" stroke="#303E5A" stroke-width="1.5"/><text x="845" y="216" fill="#F7F9FF" font-size="22" font-weight="600">PHQ-9 情绪筛查</text><rect x="1192" y="187" width="166" height="42" rx="10" fill="#202D48" stroke="#465FFF" stroke-width="1.3"/><g transform="translate(1207 199) scale(0.7083333333333334)" stroke="#97AAFF" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 10v7 M12 6v1"/></g><text x="1232" y="214" fill="#BAC7FF" font-size="16" font-weight="600">了解 PHQ-9</text><text x="1465" y="216" fill="#AEBBD4" font-size="17" font-weight="500" text-anchor="end">第 2 / 9 题</text><rect x="845" y="249" width="620" height="6" rx="3" fill="#293753"/><rect x="845" y="249" width="138" height="6" rx="3" fill="#465FFF"/><g transform="translate(846 279) scale(0.75)" stroke="#97AAFF" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="17" rx="3"/><path d="M7 2v6 M17 2v6 M3 11h18 M7 15h3 M14 15h3"/></g><text x="874" y="294" fill="#AEBBD4" font-size="16" font-weight="400">过去两周</text><text x="1010" y="294" fill="#AEBBD4" font-size="16" font-weight="400">按出现频率选择一项</text><text x="845" y="358" fill="#F7F9FF" font-size="30" font-weight="600">感到心情低落、沮丧或绝望</text><rect x="845" y="399" width="620" height="60" rx="13" fill="#1A263B" stroke="#34415E" stroke-width="1"/><circle cx="877" cy="429" r="10" fill="none" stroke="#7E8BA7" stroke-width="2"/><text x="905" y="436" fill="#CBD5E9" font-size="21" font-weight="400">完全不会</text><rect x="845" y="475" width="620" height="60" rx="13" fill="#202C49" stroke="#465FFF" stroke-width="2"/><circle cx="877" cy="505" r="10" fill="#465FFF" stroke="#465FFF" stroke-width="2"/><circle cx="877" cy="505" r="3.5" fill="#FFFFFF"/><text x="905" y="512" fill="#F7F9FF" font-size="21" font-weight="600">有几天</text><rect x="845" y="551" width="620" height="60" rx="13" fill="#1A263B" stroke="#34415E" stroke-width="1"/><circle cx="877" cy="581" r="10" fill="none" stroke="#7E8BA7" stroke-width="2"/><text x="905" y="588" fill="#CBD5E9" font-size="21" font-weight="400">超过一半的日子</text><rect x="845" y="627" width="620" height="60" rx="13" fill="#1A263B" stroke="#34415E" stroke-width="1"/><circle cx="877" cy="657" r="10" fill="none" stroke="#7E8BA7" stroke-width="2"/><text x="905" y="664" fill="#CBD5E9" font-size="21" font-weight="400">几乎每天</text><rect x="845" y="739" width="180" height="60" rx="12" fill="#172136" stroke="#6176D8" stroke-width="1.4"/><text x="935.0" y="777.0" fill="#C5D1FF" font-size="21" font-weight="600" text-anchor="middle">上一题</text><rect x="1043" y="739" width="422" height="60" rx="12" fill="#465FFF"/><text x="1254.0" y="777.0" fill="#F7F9FF" font-size="21" font-weight="600" text-anchor="middle">下一题 →</text><g transform="translate(912 828) scale(0.6666666666666666)" stroke="#8295BB" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 10v7 M12 6v1"/></g><text x="937" y="841" fill="#8295BB" font-size="15" font-weight="400">筛查用于自我了解，不等同于医学诊断。</text></svg>