# 生产部署：nginx（前端静态）+ 主业务后端 + 个人端 AI 服务 + Neo4j
# 用法：cp .env.prod.example .env.prod && 编辑密钥，然后
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
name: psych-screening-prod

services:
  neo4j:
    image: neo4j:5-community
    environment:
      # 首次启动写入密码；密码存于 volume，之后改这里不会覆盖已有认证
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?请在 .env.prod 中设置 NEO4J_PASSWORD}
      # 2C4G 机器限制内存占用
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 768m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  # 一次性任务：建约束索引 + 导入领域语料（均可重复执行）
  graph-init:
    build:
      context: ./personal-backend
    env_file: .env.prod
    environment:
      DATABASE_URL: sqlite:///./data/mental_screening.db
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      ENABLE_MOCK_ENGINES: "False"
    command: ["sh", "-c", "python scripts/init_kg.py && python scripts/seed_domain_kg.py"]
    depends_on:
      neo4j:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file: .env.prod
    environment:
      # 生产库单独命名：仓库里跟踪的 data/dev.db 是本机演示数据，不复用
      DATABASE_URL: sqlite:///./data/prod.db
      DEBUG: "False"
      ENABLE_MOCK_ENGINES: ${ENABLE_MOCK_ENGINES:-False}
      # 个人端服务在 compose 网络内的地址
      STEWARD_AGENT_URL: http://personal:8001
    volumes:
      # SQLite 与哈希检索语料都放在 ./backend/data（首次启动自动建库）
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
      # 大模型不入库：由服务器上的 backend/models 提供（见 deploy/DEPLOY.md）
      - ./backend/models:/app/models
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  personal:
    build:
      context: ./personal-backend
    env_file: .env.prod
    environment:
      DATABASE_URL: sqlite:///./data/mental_screening.db
      STEWARD_BACKEND_URL: http://backend:8000
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      # 公网部署必须关闭匿名本机放行
      ALLOW_ANONYMOUS_LOCAL: "False"
    volumes:
      - ./personal-backend/data:/app/data
    expose:
      - "8001"
    depends_on:
      neo4j:
        condition: service_healthy
      graph-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/api/v1/health', timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      # 只暴露 80；8000/8001 仅容器网络内可访问
      - "${PUBLIC_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_started
      personal:
        condition: service_started
    restart: unless-stopped

volumes:
  neo4j_data:
