/* =============================================================================
   心理筛查预警系统 · 原型设计 token
   -----------------------------------------------------------------------------
   风格基准：**沿用现有前端的视觉语言**（slate 中性 + primary #465fff），
   只在此基础上做「反 AI 味」的纪律约束，不另起一套风格：
     ① 不用渐变当主视觉 ② 不用玻璃拟态/发光边框 ③ 不用 emoji 当图标
     ④ 细边框优先于重投影 ⑤ 数字一律等宽 ⑥ 色只用于语义 ⑦ 内容全部真实
   ============================================================================= */

:root {
  color-scheme: light;

  /* ---------- Primary：沿用现有品牌色 ---------------------------------------- */
  --brand: #465fff;
  --brand-hover: #3641f5;
  --brand-active: #2a31d8;
  --brand-on-dark: #7592ff; /* 深色面上抬亮：#465fff 在深底上对比不足 */
  --brand-tint: #ecf3ff;
  --brand-tint-2: #dde9ff;
  --brand-border: #c2d6ff;
  --brand-a08: rgba(70, 95, 255, 0.08);
  --brand-a12: rgba(70, 95, 255, 0.12);
  --brand-a18: rgba(70, 95, 255, 0.18);
  --brand-a35: rgba(70, 95, 255, 0.35);
  --text-on-brand: #ffffff;

  /* ---------- Slate：沿用现有中性阶，但整体往暖侧偏一格 ----------------------
     纯石板灰（#f9fafb / #98a2b3）是所有 AI 生成后台的默认脸孔；这里保留原有
     明度阶梯，只把色相往暖侧移 4–6 度，桌面系统（macOS 灰、Notion、Linear）
     的观感也是偏暖的。所有组件只引用 var()，改这一处即可全站生效。 */
  --slate-50: #f8f7f5;
  --slate-100: #f1f0ed;
  --slate-200: #e6e4e0;
  --slate-300: #d5d2cc;
  --slate-400: #9d9a94;
  --slate-500: #6b6862;
  --slate-600: #514e49;
  --slate-700: #3b3936;
  --slate-800: #232220;
  --slate-900: #161514;
  --slate-950: #0e0e0d;

  /* 外壳（侧栏/顶栏）：**跟随模式**，与现有前端一致 —— 浅色模式浅外壳，
     深色模式深外壳；不再让管理端永远深色。 */
  --ink-950: #0c111d;
  --ink-900: #101828;
  --ink-850: #151d2c;
  --ink-800: #1d2939;
  --ink-700: #344054;
  --ink-border: #1f2a3d;
  --ink-border-soft: #182031;
  --ink-text: #f9fafb;
  --ink-text-dim: #d0d5dd;
  --ink-text-muted: #98a2b3;
  --ink-hover: rgba(255, 255, 255, 0.06);
  --ink-active: rgba(255, 255, 255, 0.1);

  /* ---------- 内容面（浅色）—— 暖中性纸面 ------------------------------------- */
  --paper: #ffffff;
  --paper-2: var(--slate-100); /* 抬升面：表头 / tile / 登录页左栏 */
  --paper-3: var(--slate-200); /* inset：骨架屏等 */
  --paper-bg: var(--slate-50);
  --paper-text: var(--slate-800);
  --paper-text-2: var(--slate-600);
  --paper-text-3: var(--slate-500); /* 灰度统一：正文灰一律 slate-500（4.9:1） */
  --paper-border: var(--slate-200);
  --paper-border-strong: var(--slate-300);
  --paper-border-control: var(--slate-500);
  --paper-hover: rgba(35, 34, 32, 0.035);

  /* ---------- 内容面（深色）—— 暖墨色，同样不是冷蓝黑 ------------------------- */
  --surface-0: var(--slate-950);
  --surface-1: #171614;
  --surface-2: #232220;
  --surface-3: var(--slate-700);
  --surface-border: #2c2a27;
  --surface-border-strong: var(--slate-700);
  --surface-text: #faf9f7;
  --surface-text-2: #d5d2cc;
  --surface-text-3: #9d9a94;
  --surface-hover: rgba(255, 255, 255, 0.045);

  /* ---------- 语义色：四级预警（沿用现有 success/warning/danger 阶）---------- */
  --state-green: #12b76a;
  --state-green-text: #039855;
  --state-green-text-dark: #6ce9a6;
  --state-yellow: #f79009;
  --state-yellow-text: #b54708;
  --state-yellow-text-dark: #fec84b;
  --state-orange: #ef6820;
  --state-orange-text: #b93815;
  --state-orange-text-dark: #fda29b;
  --state-red: #f04438;
  --state-red-text: #d92d20;
  --state-red-text-dark: #fda29b;

  --pill-green-bg: #ecfdf3;
  --pill-green-text: #027a48;
  --pill-yellow-bg: #fffaeb;
  --pill-yellow-text: #b54708;
  --pill-orange-bg: #fef6ee;
  --pill-orange-text: #b93815;
  --pill-red-bg: #fef3f2;
  --pill-red-text: #b42318;
  --pill-neutral-bg: var(--slate-100);
  --pill-neutral-text: var(--slate-600);
  --pill-brand-bg: var(--brand-tint);
  --pill-brand-text: #3538cd;

  /* ---------- 字号：正文 14px 不动，只把「小号灰字」整体上调 ---------------
     12px 的灰字在真实屏幕上偏吃力，也是「AI 生成的密排后台」的典型特征。
     表头/标签/副行统一到 12.5px，并配 0.01em 字距；数字仍走等宽。 */
  --fs-meta: 0.78125rem; /* 12.5px 表头 / tile label / 副行 */
  --fs-label: 0.8125rem; /* 13px   字段 label / 小按钮 */
  --fs-base: 0.875rem; /* 14px   正文（现有前端基准） */
  --fs-read: 0.9375rem; /* 15px   输入框 / 阅读面 */
  --fs-title: 1.0625rem; /* 17px   卡片标题 */
  --fs-kpi: 1.375rem; /* 22px KPI 数值 */
  --fs-h1: 1.5rem; /* 24px  页面标题（现有 text-2xl） */
  --lh-tight: 1.3;
  --lh-base: 1.55;
  --lh-cjk: 1.75; /* 中文正文需要更松的行高 */
  --tracking-h1: -0.01em;

  /* ---------- 间距：2px 网格 -------------------------------------------------- */
  --sp-1: 2px;
  --sp-2: 4px;
  --sp-3: 6px;
  --sp-4: 8px;
  --sp-5: 10px;
  --sp-6: 12px;
  --sp-8: 16px;
  --sp-10: 20px;
  --sp-12: 24px;
  --sp-16: 32px;

  /* ---------- 圆角：贴近现有（lg/xl），不搞混搭 ------------------------------ */
  --r-chrome: 6px;
  --r-control: 8px;
  --r-card: 10px;
  --r-float: 12px;
  --r-pill: 999px;

  /* ---------- 阴影：外壳不用阴影，只靠 1px 细边；仅浮动层用 ------------------ */
  --shadow-float: 0 12px 32px -8px rgba(16, 24, 40, 0.18), 0 2px 6px -2px rgba(16, 24, 40, 0.08);
  --shadow-tooltip: 0 6px 20px rgba(16, 24, 40, 0.14);
  --scrim: rgba(12, 17, 29, 0.55);

  /* ---------- 动效：0.12–0.22s ------------------------------------------------ */
  --d-fast: 0.12s;
  --d-base: 0.15s;
  --d-move: 0.18s;
  --d-enter: 0.32s;
  --ease-move: cubic-bezier(0.22, 0.61, 0.36, 1);

  /* ---------- 布局尺度 -------------------------------------------------------- */
  --sidebar-w: 236px;
  --sidebar-w-collapsed: 64px;
  --topbar-h: 56px;
  --content-max: 1600px;
  --content-max-form: 1200px;
}

/* =============================================================================
   当前生效的内容面（组件只引用 --bg-* / --txt-* / --line-*）
   ============================================================================= */
:root,
[data-mode='light'] {
  --bg-page: var(--paper-bg);
  --bg-card: var(--paper);
  --bg-raised: var(--paper-2);
  --bg-inset: var(--paper-3);
  --txt-1: var(--paper-text);
  --txt-2: var(--paper-text-2);
  --txt-3: var(--paper-text-3);
  --line: var(--paper-border);
  --line-strong: var(--paper-border-strong);
  --line-control: var(--paper-border-control);
  --accent: var(--brand);
  --accent-hover: var(--brand-hover);
  --text-on-accent: var(--text-on-brand);
  --accent-tint: var(--brand-tint);
  --accent-tint-2: var(--brand-tint-2);
  --accent-border: var(--brand-border);
  --accent-a12: var(--brand-a12);
  --hover-surface: var(--paper-hover);
  --score-track: var(--slate-200);
  color-scheme: light;
}

[data-mode='dark'] {
  --bg-page: var(--surface-0);
  --bg-card: var(--surface-1);
  --bg-raised: var(--surface-2);
  --bg-inset: var(--surface-3);
  --txt-1: var(--surface-text);
  --txt-2: var(--surface-text-2);
  --txt-3: var(--surface-text-3);
  --line: var(--surface-border);
  --line-strong: var(--surface-border-strong);
  --line-control: var(--slate-500);
  --accent: var(--brand-on-dark);
  --accent-hover: #9cb9ff;
  --text-on-accent: #0c1226;
  --accent-tint: rgba(117, 146, 255, 0.14);
  --accent-tint-2: rgba(117, 146, 255, 0.2);
  --accent-border: rgba(117, 146, 255, 0.35);
  --accent-a12: rgba(117, 146, 255, 0.12);
  --hover-surface: var(--surface-hover);
  --score-track: #26324a;

  --state-green-text: var(--state-green-text-dark);
  --state-yellow-text: var(--state-yellow-text-dark);
  --state-orange-text: var(--state-orange-text-dark);
  --state-red-text: var(--state-red-text-dark);
  --pill-green-bg: rgba(18, 183, 106, 0.16);
  --pill-green-text: #6ce9a6;
  --pill-yellow-bg: rgba(247, 144, 9, 0.16);
  --pill-yellow-text: #fec84b;
  --pill-orange-bg: rgba(239, 104, 32, 0.18);
  --pill-orange-text: #fda29b;
  --pill-red-bg: rgba(240, 68, 56, 0.18);
  --pill-red-text: #fda29b;
  --pill-neutral-bg: rgba(255, 255, 255, 0.08);
  --pill-neutral-text: var(--surface-text-2);
  --pill-brand-bg: rgba(117, 146, 255, 0.16);
  --pill-brand-text: #b2ccff;
  color-scheme: dark;
}

/* =============================================================================
   两个端：同一套风格，只在「密度」上区分（不做「一模块一色」）
   ============================================================================= */
[data-surface='admin'] {
  --fs-base: 0.875rem;
  --card-pad: var(--sp-8) var(--sp-10);
  --card-gap: var(--sp-5);
}

[data-surface='personal'] {
  --fs-base: 0.875rem;
  --card-pad: var(--sp-10) var(--sp-10);
  --card-gap: var(--sp-5);
}


/* =============================================================================
   base.css · 组件层
   规则来源：管理端控件/表格/密度规范 + 个人端排版研究（暖中性、零阴影、分层圆角）
   本文件不出现任何裸色值，一律引用 tokens.css 的 var()
   ============================================================================= */

:root {
  --font-sans: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
    'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* 禁用态用「成对的明确色值」而不是 opacity（opacity .55 时对比度只有 2.96:1） */
  --btn-disabled-bg: var(--bg-inset);
  --btn-disabled-text: var(--txt-3);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

html {
  /* 该属性不是装饰：它驱动断词、引号形态、CJK 字体选择与读屏发音 */
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--font-sans);
  font-size: var(--fs-base);
  line-height: var(--lh-base);
  color: var(--txt-1);
  background: var(--bg-page);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* 中文正文需要更松的行高才可读 */
p,
li,
dd,
dt {
  line-height: var(--lh-cjk);
}

h1,
h2,
h3,
h4 {
  margin: 0;
  font-weight: 700;
  line-height: var(--lh-tight);
  color: var(--txt-1);
}
h1 {
  font-size: var(--fs-h1);
  letter-spacing: var(--tracking-h1);
}
h2 {
  font-size: var(--fs-title);
}
h3 {
  font-size: var(--fs-base);
}
h4 {
  font-size: var(--fs-label);
}

a {
  color: var(--accent);
  text-decoration: none;
}
a:hover {
  text-decoration: underline;
  text-underline-offset: 2px;
}

button {
  font: inherit;
  color: inherit;
}

svg {
  display: block;
}

/* 焦点：任何时刻恰好一个，且必须可见（focus-visible 揭示与 hover 同样的信息） */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
  border-radius: var(--r-chrome);
}

::selection {
  background: var(--accent-a12);
}

/* ---------- 文本工具 -------------------------------------------------------- */
.num {
  /* 用在「每一个」数字上：表格、KPI、轴标签、tooltip、计数器 */
  text-align: end;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.mono {
  font-family: var(--font-mono);
  font-size: 0.92em;
  letter-spacing: -0.01em;
}
.muted {
  color: var(--txt-2);
}
.dim {
  color: var(--txt-3);
}
.eyebrow {
  font-size: var(--fs-meta);
  font-weight: 600;
  color: var(--txt-3);
  letter-spacing: 0.02em;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* ---------- 卡片：只有一个 .card，不做 panel/box/section 变体 --------------- */
.card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  padding: var(--card-pad, var(--sp-8) var(--sp-10));
}
.card--flush {
  padding: 0;
  overflow: hidden;
}
.card__head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--sp-6);
  margin-bottom: var(--sp-8);
}
.card__head--tight {
  margin-bottom: var(--sp-5);
}
.card__title {
  font-size: var(--fs-title);
  font-weight: 700;
}
.card__desc {
  margin: var(--sp-2) 0 0;
  font-size: var(--fs-label);
  color: var(--txt-3);
  line-height: var(--lh-base);
}
.card__foot {
  margin-top: var(--sp-8);
  padding-top: var(--sp-6);
  border-top: 1px solid var(--line);
}
.grid {
  display: grid;
  gap: var(--card-gap, var(--sp-6));
}
.grid--2 {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.grid--3 {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
.grid--sidebar {
  grid-template-columns: minmax(0, 1.62fr) minmax(0, 1fr);
  align-items: start; /* 不让卡片被同行的另一列拉高，避免大片空白 */
}
@media (max-width: 1100px) {
  .grid--sidebar,
  .grid--3 {
    grid-template-columns: minmax(0, 1fr);
  }
}
@media (max-width: 720px) {
  .grid--2 {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* ---------- KPI tile：数字永不着色，判断写在副行 --------------------------- */
.tiles {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
  gap: var(--sp-3);
}
.tile {
  padding: var(--sp-5) var(--sp-5) var(--sp-4);
  border: 1px solid var(--line);
  border-left: 2px solid var(--accent-border);
  border-radius: var(--r-card);
  background: var(--bg-raised);
}
.tile__label {
  font-size: var(--fs-meta);
  font-weight: 500;
  letter-spacing: 0.01em;
  color: var(--txt-2);
}
.tile__value {
  margin-top: var(--sp-2);
  font-size: var(--fs-kpi);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tile__value small {
  font-size: var(--fs-label);
  font-weight: 600;
  color: var(--txt-3);
}
.tile__sub {
  margin-top: var(--sp-1);
  font-size: var(--fs-meta);
  color: var(--txt-3);
}

/* ---------- 表格：容器滚动、列不压缩；表头比正文小且灰 --------------------- */
.table-wrap {
  position: relative; /* 必需：否则 icon-only 表头的 .sr-only 会逃出滚动容器 */
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  background: var(--bg-card);
}
.table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--fs-base);
}
.table th {
  padding: var(--sp-4) var(--sp-6);
  position: sticky;
  top: 0;
  z-index: 1;
  font-size: var(--fs-meta);
  font-weight: 500;
  letter-spacing: 0.01em;
  color: var(--txt-2);
  text-align: start;
  background: var(--bg-raised);
  border-bottom: 1px solid var(--line-strong);
  white-space: nowrap;
}
.table td {
  height: 2rem; /* 32px：够密，又不至于挤 */
  padding: var(--sp-4) var(--sp-6);
  line-height: 1.35;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}
.table tbody tr:last-child td {
  border-bottom: 0;
}
.table tbody tr:hover td {
  background: var(--hover-surface);
}
.table .col-act {
  padding-block: var(--sp-1); /* 防行内按钮撑高行 */
  text-align: end;
}
.table .col-status {
  padding-block: 0;
}
.table .truncate {
  max-width: 17rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.table__empty td {
  height: auto;
  padding: 0;
}

/* ---------- pill：淡底深字 -------------------------------------------------- */
.pill {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  height: 1.375rem; /* 22px */
  padding: 0 var(--sp-3);
  border-radius: var(--r-chrome);
  font-size: var(--fs-meta);
  font-weight: 500;
  letter-spacing: 0.01em;
  white-space: nowrap;
  background: var(--pill-neutral-bg);
  color: var(--pill-neutral-text);
}
.pill--green {
  background: var(--pill-green-bg);
  color: var(--pill-green-text);
}
.pill--yellow {
  background: var(--pill-yellow-bg);
  color: var(--pill-yellow-text);
}
.pill--orange {
  background: var(--pill-orange-bg);
  color: var(--pill-orange-text);
}
.pill--red {
  background: var(--pill-red-bg);
  color: var(--pill-red-text);
}
.pill--brand {
  background: var(--pill-brand-bg);
  color: var(--pill-brand-text);
}
.pill__dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  flex: none;
}

/* ---------- 按钮 ------------------------------------------------------------ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-3);
  min-height: 32px;
  padding: 0 var(--sp-6);
  border: 1px solid var(--line-control);
  border-radius: var(--r-btn, var(--r-control));
  background: var(--bg-card);
  color: var(--txt-1);
  font-size: var(--fs-base);
  font-weight: 600;
  cursor: pointer;
  transition:
    background var(--d-base) ease,
    border-color var(--d-base) ease,
    color var(--d-base) ease;
}
.btn:hover:not(:disabled) {
  background: var(--bg-raised);
  border-color: var(--txt-3);
}
.btn:active:not(:disabled) {
  background: var(--bg-inset);
}
.btn:disabled {
  background: var(--btn-disabled-bg);
  border-color: var(--line);
  color: var(--btn-disabled-text);
  cursor: not-allowed;
}
.btn svg {
  width: 15px;
  height: 15px;
  flex: none;
}
.btn--primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--text-on-accent);
}
.btn--primary:hover:not(:disabled) {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
}
.btn--primary:active:not(:disabled) {
  filter: brightness(0.94);
}
.btn--ghost {
  background: transparent;
  border-color: transparent;
  color: var(--txt-2);
}
.btn--ghost:hover:not(:disabled) {
  background: var(--hover-surface);
  border-color: transparent;
  color: var(--txt-1);
}
.btn--danger {
  border-color: var(--pill-red-text);
  color: var(--pill-red-text);
}
.btn--sm {
  min-height: 26px;
  padding: 0 var(--sp-4);
  font-size: var(--fs-meta);
}
.btn--lg {
  min-height: 40px;
  padding: 0 var(--sp-8);
  font-size: var(--fs-read);
}
/* 纯图标按钮：命中区 ≥24×24，且必须有可访问名 */
.iconbtn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border: 1px solid var(--line);
  border-radius: var(--r-control);
  background: var(--bg-card);
  color: var(--txt-2);
  cursor: pointer;
  transition:
    background var(--d-base) ease,
    color var(--d-base) ease,
    border-color var(--d-base) ease;
}
.iconbtn:hover:not(:disabled) {
  background: var(--bg-raised);
  color: var(--txt-1);
}
.iconbtn svg {
  width: 16px;
  height: 16px;
}

/* ---------- 表单：label 包裹控件，且比 value 更小更轻更灰 ------------------- */
.field {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 0;
}
.field > span {
  font-size: var(--fs-label);
  font-weight: 600;
  color: var(--txt-2);
}
.field input,
.field select,
.field textarea,
.input {
  width: 100%;
  min-width: 0;
  min-height: 36px;
  padding: var(--sp-4) var(--sp-5);
  border: 1px solid var(--line-control);
  border-radius: var(--r-control);
  background: var(--bg-card);
  color: var(--txt-1);
  font: inherit;
  font-size: var(--fs-read);
  font-weight: 400;
  transition:
    border-color var(--d-base) ease,
    box-shadow var(--d-base) ease;
}
.field textarea {
  min-height: 92px;
  line-height: var(--lh-cjk);
  resize: vertical;
}
.field input::placeholder,
.field textarea::placeholder {
  color: var(--txt-3);
}
.field input:focus,
.field select:focus,
.field textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-a12);
}
.filters {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: var(--sp-6);
  align-items: end;
}
.search {
  position: relative;
  display: flex;
  align-items: center;
}
.search svg {
  position: absolute;
  left: var(--sp-5);
  width: 15px;
  height: 15px;
  color: var(--txt-3);
  pointer-events: none;
}
.search input {
  padding-left: var(--sp-12);
}

/* ---------- chips / 分段控件 ------------------------------------------------- */
.chips {
  display: inline-flex;
  gap: var(--sp-2);
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: var(--r-control);
  background: var(--bg-raised);
}
.chip {
  min-height: 26px;
  padding: 0 var(--sp-5);
  border: 0;
  border-radius: calc(var(--r-control) - 3px);
  background: transparent;
  color: var(--txt-2);
  font-size: var(--fs-label);
  font-weight: 600;
  cursor: pointer;
  transition:
    background var(--d-base) ease,
    color var(--d-base) ease;
}
.chip:hover:not([aria-pressed='true']) {
  color: var(--txt-1);
  background: var(--hover-surface);
}
.chip[aria-pressed='true'] {
  background: var(--bg-card);
  color: var(--txt-1);
  box-shadow: inset 0 0 0 1px var(--line);
}
.tag {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 var(--sp-4);
  border: 1px solid var(--line);
  border-radius: var(--r-control);
  background: var(--bg-raised);
  font-size: var(--fs-meta);
  font-weight: 600;
  color: var(--txt-2);
}
.tag--brand {
  border-color: var(--accent-border);
  background: var(--accent-tint);
  color: var(--pill-brand-text);
}

/* ---------- 相似度分数条（行内，显式呈现「相关性悬崖」） ------------------- */
.scorebar {
  position: relative;
  width: 88px;
  height: 6px;
  border-radius: var(--r-pill);
  background: var(--score-track);
  overflow: hidden;
}
.scorebar__fill {
  position: absolute;
  inset: 0 auto 0 0;
  width: var(--v, 0%);
  border-radius: var(--r-pill);
  background: var(--accent);
}
.scorebar--muted .scorebar__fill {
  background: var(--txt-3);
}
.tier {
  font-size: var(--fs-meta);
  font-weight: 600;
  color: var(--txt-2);
}
.tier--strong {
  color: var(--state-green-text);
}
.tier--mid {
  color: var(--state-yellow-text);
}
.tier--weak {
  color: var(--txt-3);
}

/* ---------- 量表分数带（结果页用，分数只做辅助） --------------------------- */
.band {
  display: flex;
  gap: var(--sp-1);
  margin: var(--sp-6) 0 var(--sp-3);
}
.band__seg {
  flex: 1;
  height: 6px;
  border-radius: 2px;
  background: var(--bg-inset);
}
.band__seg[data-on='1'] {
  background: var(--state-green);
}
.band__seg[data-on='2'] {
  background: var(--state-yellow);
}
.band__seg[data-on='3'] {
  background: var(--state-orange);
}
.band__seg[data-on='4'] {
  background: var(--state-red);
}
/* 结果带：轨道的「段」只负责长度，颜色只给当前所处的那一段。
   0–4/5–9 → 绿、10–14 → 黄、15–19 → 橙、20–27 → 红（与后端 alert_rules 同源）。 */
.band--focus .band__seg {
  background: var(--bg-inset);
}
.band--focus .band__seg[data-active] {
  background: var(--state-orange);
}
.band__legend {
  display: flex;
  justify-content: space-between;
  font-size: var(--fs-meta);
  color: var(--txt-3);
}

/* ---------- 细进度条（量表作答用，配「第 x / y 题」文字） ------------------ */
.progress {
  height: 4px;
  border-radius: var(--r-pill);
  background: var(--bg-inset);
  overflow: hidden;
}
.progress__fill {
  height: 100%;
  width: var(--v, 0%);
  background: var(--accent);
  transition: width var(--d-move) var(--ease-move);
}

/* 语义进度条：用 --state-*-text 而不是 --state-*，浅深两种模式都够对比 */
.progress__fill--yellow {
  background: var(--state-yellow-text);
}
.progress__fill--orange {
  background: var(--state-orange-text);
}
.progress__fill--red {
  background: var(--state-red-text);
}
.progress__fill--green {
  background: var(--state-green-text);
}

/* ---------- 提示块：不做阻塞式弹窗，就地展开 ------------------------------- */
.note {
  display: flex;
  gap: var(--sp-5);
  padding: var(--sp-6) var(--sp-6);
  border: 1px solid var(--line);
  border-left: 3px solid var(--txt-3);
  border-radius: var(--r-card);
  background: var(--bg-raised);
  font-size: var(--fs-base);
}
.note__body {
  min-width: 0;
}
.note__title {
  font-weight: 700;
  font-size: var(--fs-base);
}
.note p {
  margin: var(--sp-2) 0 0;
  color: var(--txt-2);
  line-height: var(--lh-cjk);
}
.note--brand {
  border-color: var(--accent-border);
  border-left-color: var(--accent);
  background: var(--accent-tint);
}
.note--care {
  border-color: var(--accent-border);
  border-left-color: var(--accent);
  background: var(--accent-tint-2);
}
.note--warn {
  border-left-color: var(--state-orange);
  background: var(--bg-raised);
  border-color: var(--line);
}

/* ---------- 时间线 ---------------------------------------------------------- */
.timeline {
  margin: 0;
  padding: 0;
  list-style: none;
}
.timeline__item {
  position: relative;
  padding: 0 0 var(--sp-8) var(--sp-10);
  border-left: 1px solid var(--line);
}
.timeline__item:last-child {
  padding-bottom: 0;
  border-left-color: transparent;
}
.timeline__item::before {
  content: '';
  position: absolute;
  left: -4px;
  top: 5px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--txt-3);
  box-shadow: 0 0 0 3px var(--bg-card);
}
.timeline__item[data-level='green']::before {
  background: var(--state-green);
}
.timeline__item[data-level='yellow']::before {
  background: var(--state-yellow);
}
.timeline__item[data-level='orange']::before {
  background: var(--state-orange);
}
.timeline__item[data-level='red']::before {
  background: var(--state-red);
}
.timeline__date {
  font-size: var(--fs-meta);
  color: var(--txt-3);
  font-variant-numeric: tabular-nums;
}
.timeline__title {
  margin: var(--sp-1) 0 0;
  font-size: var(--fs-base);
  font-weight: 600;
}
.timeline__desc {
  margin: var(--sp-1) 0 0;
  font-size: var(--fs-label);
  color: var(--txt-2);
}

/* ---------- 列表行（行动计划、量表选择等） --------------------------------- */
.rowlist {
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}
.rowitem {
  display: flex;
  align-items: center;
  gap: var(--sp-6);
  padding: var(--sp-5) var(--sp-6);
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  background: var(--bg-card);
}
.rowitem__idx {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  flex: none;
  border-radius: var(--r-control);
  background: var(--accent-tint);
  color: var(--pill-brand-text);
  font-size: var(--fs-meta);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.rowitem__main {
  min-width: 0;
  flex: 1;
}
.rowitem__title {
  font-size: var(--fs-base);
  font-weight: 600;
}
.rowitem__meta {
  margin-top: var(--sp-1);
  font-size: var(--fs-label);
  color: var(--txt-3);
}

/* ---------- 移动端抽屉遮罩：点它就收起，替代没有交互的空白 ------------------- */
.scrim {
  position: fixed;
  inset: 0;
  z-index: 45; /* 低于 .sidebar 的 50，高于内容 */
  background: var(--scrim);
  border: 0;
}
@media (min-width: 1024px) {
  .scrim {
    display: none;
  }
}

/* ---------- 头像 ------------------------------------------------------------ */
.avatar {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  flex: none;
  border-radius: 50%;
  background: var(--accent-tint);
  color: var(--pill-brand-text);
  font-size: var(--fs-label);
  font-weight: 700;
}

/* ---------- 空态：三种措辞必须不同 ----------------------------------------- */
.empty {
  padding: var(--sp-10) var(--sp-8);
  text-align: center;
  font-size: var(--fs-base);
  color: var(--txt-3);
}
.empty__title {
  font-weight: 600;
  color: var(--txt-2);
}
.empty p {
  margin: var(--sp-2) 0 0;
}
.empty--error .empty__title {
  color: var(--state-red-text);
}

/* ---------- 骨架屏：opacity 脉冲（不用 travelling highlight） --------------- */
.skeleton {
  height: 11px;
  border-radius: 3px;
  background: var(--bg-inset);
  animation: sk 1.1s ease-in-out infinite;
}
.skeleton--short {
  width: 45%;
}
.skeleton--right {
  width: 60%;
  margin-inline-start: auto;
}
@keyframes sk {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0.45;
  }
}

/* ---------- 其它小件 -------------------------------------------------------- */
.stack {
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
}
.stack--tight {
  gap: var(--sp-2);
}
.inline {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  flex-wrap: wrap;
}
.spread {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-6);
}
.divider {
  height: 1px;
  background: var(--line);
  border: 0;
  margin: var(--sp-8) 0;
}
.kbd {
  display: inline-flex;
  align-items: center;
  height: 20px;
  padding: 0 var(--sp-3);
  border: 1px solid var(--line);
  border-radius: var(--r-chrome);
  background: var(--bg-raised);
  font-family: var(--font-mono);
  font-size: var(--fs-meta);
  color: var(--txt-2);
}
.dl {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: var(--sp-4) var(--sp-8);
  margin: 0;
}
.dl dt {
  font-size: var(--fs-label);
  color: var(--txt-3);
}
.dl dd {
  margin: 0;
  font-size: var(--fs-base);
  font-variant-numeric: tabular-nums;
}
details.tech {
  border-top: 1px solid var(--line);
  padding-top: var(--sp-5);
  margin-top: var(--sp-6);
}
details.tech > summary {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  min-height: 24px;
  cursor: pointer;
  font-size: var(--fs-label);
  font-weight: 600;
  color: var(--txt-2);
  list-style: none;
}
details.tech > summary::-webkit-details-marker {
  display: none;
}
details.tech > summary::before {
  content: '';
  width: 0;
  height: 0;
  border-left: 5px solid currentColor;
  border-block: 4px solid transparent;
  transition: transform var(--d-base) var(--ease-move);
}
details.tech[open] > summary::before {
  transform: rotate(90deg);
}
details.tech > summary:hover {
  color: var(--txt-1);
}
details.tech .dl {
  margin-top: var(--sp-5);
}

/* ---------- 检索结果列表 ---------------------------------------------------- */
.resultlist {
  margin: 0;
  padding: 0;
  list-style: none;
  border-top: 1px solid var(--line);
}
.result {
  display: grid;
  grid-template-columns: 168px minmax(0, 1fr) 116px;
  gap: var(--sp-6);
  align-items: start;
  padding: var(--sp-6) var(--sp-10);
  border-bottom: 1px solid var(--line);
}
.result:last-child {
  border-bottom: 0;
}
.result:hover {
  background: var(--hover-surface);
}
.result__media {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  align-items: flex-start;
}
.result__main {
  min-width: 0;
}
.result__id {
  font-weight: 700;
}
.result__why {
  margin: var(--sp-4) 0 0;
  font-size: var(--fs-base);
  color: var(--txt-2);
  line-height: var(--lh-cjk);
}
.result__score {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  align-items: flex-end;
  text-align: end;
}
@media (max-width: 900px) {
  .result {
    grid-template-columns: minmax(0, 1fr);
  }
  .result__score {
    align-items: flex-start;
    text-align: start;
  }
}

.pill--neutral {
  background: var(--pill-neutral-bg);
  color: var(--pill-neutral-text);
}

/* ---------- 作答页：一屏一题的题面与选项 -------------------------------------
   选项用原生 radio（键盘可操作、可读屏），视觉上做成整块按钮；
   选中为「深色实心」而非变色边框 —— 一屏一题时不存在多选歧义。 */
.card--tight {
  --card-pad: var(--sp-8) var(--sp-8);
  /* 作答页主体不跟着超宽屏拉长：一屏一题时行长过长会让选项显得散。
     用 width 而非 max-width —— 不让这条规则改变栅格自身的列宽分配。 */
  width: min(100%, 780px);
}
.steps {
  display: flex;
  gap: var(--sp-2);
  margin-top: var(--sp-6);
}
.step {
  flex: 1;
  height: 6px;
  border-radius: 2px;
  background: var(--bg-inset);
}
.step[data-on='done'] {
  background: var(--accent);
}
.step[data-on='now'] {
  background: var(--accent-a35, var(--accent));
  box-shadow: 0 0 0 1px var(--accent-border);
}
.question__text {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-5);
  margin: 0;
  font-size: var(--fs-read);
  font-weight: 600;
  line-height: var(--lh-cjk);
}
.question__idx {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  flex: none;
  margin-top: 1px;
  border-radius: 50%;
  background: var(--accent-tint);
  color: var(--pill-brand-text);
  font-size: var(--fs-meta);
  font-weight: 700;
}
.options {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--sp-3);
  margin-top: var(--sp-8);
}
@media (max-width: 720px) {
  .options {
    grid-template-columns: minmax(0, 1fr);
  }
}
.option {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-4);
  min-height: 46px;
  padding: 0 var(--sp-6);
  border: 1px solid var(--line);
  border-radius: var(--r-control);
  background: var(--bg-card);
  color: var(--txt-2);
  font-size: var(--fs-base);
  cursor: pointer;
  transition:
    border-color var(--d-base) ease,
    background var(--d-base) ease,
    color var(--d-base) ease;
}
.option:hover {
  border-color: var(--accent-border);
  background: var(--accent-tint);
  color: var(--txt-1);
}
.option input[type='radio'] {
  appearance: none;
  width: 14px;
  height: 14px;
  min-height: 0;
  flex: none;
  margin: 0;
  padding: 0;
  border: 1.5px solid var(--line-strong);
  border-radius: 50%;
  background: transparent;
}
.option input[type='radio']:checked {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 3px var(--bg-card), inset 0 0 0 9px var(--accent);
}
.option input[type='radio']:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.option:has(input:checked) {
  border-color: var(--accent);
  background: var(--accent);
  color: var(--text-on-accent);
}
.option:has(input:checked) .option__score {
  color: var(--text-on-accent);
  opacity: 0.75;
}
.option__label {
  font-weight: 600;
}
.option__score {
  font-size: var(--fs-meta);
  color: var(--txt-3);
  transition: color var(--d-base) ease;
}

/* ---------- 模态切换：跟 chips 同源，但不放在凹槽里（内容区本身要展开） ------- */
.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2);
  padding: var(--sp-2) 0 0;
  border-bottom: 1px solid var(--line);
}
.tab {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-3);
  min-height: 34px;
  padding: 0 var(--sp-6);
  border: 0;
  border-bottom: 2px solid transparent;
  background: transparent;
  color: var(--txt-2);
  font: inherit;
  font-size: var(--fs-base);
  font-weight: 600;
  cursor: pointer;
}
.tab:hover {
  color: var(--txt-1);
}
.tab[aria-selected='true'] {
  color: var(--accent);
  border-bottom-color: var(--accent);
}
.tab__count {
  font-size: var(--fs-meta);
  font-weight: 700;
  color: var(--txt-3);
  font-variant-numeric: tabular-nums;
}

/* ---------- 录音台：大数字 + 波形，控件在下方（不用圆形红点那套） ----------- */
.recorder {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-8);
  padding: var(--sp-10) var(--sp-8);
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  background: var(--bg-raised);
}
.recorder__clock {
  font-family: var(--font-mono);
  font-size: 2.25rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}
.recorder__clock small {
  font-size: var(--fs-read);
  font-weight: 500;
  color: var(--txt-3);
}
.recorder__wave {
  width: 100%;
  height: 56px;
}
.recorder__hint {
  margin: 0;
  font-size: var(--fs-label);
  color: var(--txt-3);
  text-align: center;
  line-height: var(--lh-cjk);
}

/* ---------- 已提交条目：左侧一个细条，不做整块成功色 ------------------------ */
.entry {
  display: flex;
  align-items: center;
  gap: var(--sp-6);
  padding: var(--sp-5) var(--sp-6);
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  background: var(--bg-card);
}
.entry__media {
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  flex: none;
  border-radius: var(--r-control);
  background: var(--bg-raised);
  border: 1px solid var(--line);
  color: var(--txt-3);
}
.entry__main {
  min-width: 0;
  flex: 1;
}
.entry__title {
  font-size: var(--fs-base);
  font-weight: 600;
}
.entry__meta {
  margin-top: var(--sp-1);
  font-size: var(--fs-label);
  color: var(--txt-3);
  font-variant-numeric: tabular-nums;
}
.entry__side {
  flex: none;
  text-align: end;
  font-size: var(--fs-meta);
  color: var(--txt-3);
}
.filelist {
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}

/* ---------- 上传区：虚线只表示「可放入」，不是装饰 --------------------------- */
.uploadzone {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-8) var(--sp-6);
  border: 1px dashed var(--line-strong);
  border-radius: var(--r-card);
  background: var(--bg-raised);
  text-align: center;
}
.uploadzone__icon {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: var(--r-control);
  background: var(--bg-card);
  border: 1px solid var(--line);
  color: var(--txt-3);
}
.uploadzone__title {
  font-size: var(--fs-base);
  font-weight: 600;
}
.uploadzone__meta {
  font-size: var(--fs-label);
  color: var(--txt-3);
  line-height: var(--lh-base);
}

/* ---------- 预警提示卡：左侧一条 3px 色条作为唯一语义色，其余保持中性 ------- */
.alertcard {
  padding: var(--sp-6) var(--sp-6) var(--sp-6) var(--sp-8);
  border: 1px solid var(--line);
  border-left: 3px solid var(--txt-3);
  border-radius: var(--r-card);
  background: var(--bg-card);
}
.alertcard[data-level='green'] {
  border-left-color: var(--state-green);
}
.alertcard[data-level='yellow'] {
  border-left-color: var(--state-yellow);
}
.alertcard[data-level='orange'] {
  border-left-color: var(--state-orange);
}
.alertcard[data-level='red'] {
  border-left-color: var(--state-red);
}
.alertcard + .alertcard {
  margin-top: var(--sp-3);
}
.alertcard__title {
  font-size: var(--fs-base);
  font-weight: 700;
}
.alertcard__body {
  margin: var(--sp-3) 0 0;
  font-size: var(--fs-base);
  color: var(--txt-2);
  line-height: var(--lh-cjk);
}
.alertcard__acts {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-3);
  margin-top: var(--sp-5);
  padding-top: var(--sp-5);
  border-top: 1px solid var(--line);
}
.alertcard[data-status='resolved'] {
  background: var(--bg-raised);
}
.alertcard__foot {
  margin-inline-start: auto;
  font-size: var(--fs-meta);
  color: var(--txt-3);
}

/* ---------- 语义圆点：图例与序列标识（尺寸统一 8px） ------------------------ */
.dot {
  width: 8px;
  height: 8px;
  flex: none;
  border-radius: 50%;
  background: var(--txt-3);
}
.dot--yellow {
  background: var(--state-yellow);
}
.dot--orange {
  background: var(--state-orange);
}
.dot--red {
  background: var(--state-red);
}
.dot--green {
  background: var(--state-green);
}

/* ---------- 环形图：用 stroke-dasharray 画，不引图表库 ---------------------- */
.donut {
  position: relative;
  display: grid;
  place-items: center;
  margin: var(--sp-6) 0 var(--sp-2);
}
.donut__center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--sp-1);
  pointer-events: none;
}

/* ---------- 报告正文：编号 + 标题 + 正文，三段用一条竖线串起来 ------------- */
.report {
  margin: 0;
  padding: 0;
  list-style: none;
}
.report__item {
  display: flex;
  gap: var(--sp-6);
  padding-bottom: var(--sp-8);
}
.report__item:last-child {
  padding-bottom: 0;
}
.report__rail {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-3);
  flex: none;
  width: 26px;
}
.report__step {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  flex: none;
  border-radius: 50%;
  background: var(--accent-tint);
  color: var(--pill-brand-text);
  font-size: var(--fs-meta);
  font-weight: 700;
}
.report__rail::after {
  content: '';
  flex: 1;
  width: 1px;
  background: var(--line);
}
.report__item:last-child .report__rail::after {
  display: none;
}
.report__main {
  min-width: 0;
  flex: 1;
  padding-bottom: 0;
}
.report__title {
  margin: 0;
  font-size: var(--fs-title);
  font-weight: 700;
}
.report__body {
  margin: var(--sp-4) 0 0;
  font-size: var(--fs-base);
  color: var(--txt-2);
  line-height: var(--lh-cjk);
}

/* =============================================================================
   选择系统：无外壳的一屏。两张门卡是唯一焦点，不做插画也不做渐变。
   ============================================================================= */
.selector {
  display: grid;
  place-items: center;
  min-height: 100vh;
  padding: var(--sp-12) var(--sp-8);
  background: var(--bg-page);
}
.selector__inner {
  width: min(100%, 960px);
}
.selector__head {
  display: flex;
  align-items: center;
  gap: var(--sp-6);
  margin-bottom: var(--sp-12);
}
.selector__mark {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  flex: none;
  border-radius: var(--r-card);
  background: var(--accent);
  color: var(--text-on-accent);
}
.selector__head h1 {
  margin: 0;
  font-size: var(--fs-h1);
  font-weight: 700;
  letter-spacing: var(--tracking-h1);
}
.selector__head p {
  margin: var(--sp-2) 0 0;
  font-size: var(--fs-base);
  color: var(--txt-2);
}
.selector__grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--sp-8);
}
@media (max-width: 780px) {
  .selector__grid {
    grid-template-columns: minmax(0, 1fr);
  }
}
.door {
  display: flex;
  flex-direction: column;
  gap: var(--sp-5);
  padding: var(--sp-10);
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  background: var(--bg-card);
  color: inherit;
  text-decoration: none;
  transition:
    border-color var(--d-base) ease,
    transform var(--d-move) var(--ease-move);
}
.door:hover {
  border-color: var(--accent-border);
  transform: translateY(-2px);
}
.door:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
.door__icon {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: var(--r-control);
  background: var(--accent-tint);
  color: var(--pill-brand-text);
}
.door h2 {
  margin: 0;
  font-size: var(--fs-title);
  font-weight: 700;
}
.door__desc {
  margin: 0;
  font-size: var(--fs-base);
  color: var(--txt-2);
  line-height: var(--lh-cjk);
}
.door__list {
  margin: 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
  font-size: var(--fs-label);
  color: var(--txt-3);
}
.door__list li {
  padding-inline-start: var(--sp-6);
  position: relative;
}
.door__list li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 7px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--line-strong);
}
.door__go {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-3);
  margin-top: auto;
  padding-top: var(--sp-5);
  border-top: 1px solid var(--line);
  font-size: var(--fs-base);
  font-weight: 600;
  color: var(--accent);
}
.selector__foot {
  display: flex;
  justify-content: space-between;
  gap: var(--sp-6);
  margin-top: var(--sp-12);
  padding-top: var(--sp-6);
  border-top: 1px solid var(--line);
  font-size: var(--fs-label);
  color: var(--txt-3);
}
.selector__foot a {
  color: var(--accent);
  text-decoration: none;
}
.selector__foot a:hover {
  text-decoration: underline;
}

/* =============================================================================
   原型门面：标题区事实条 / 演示动线 / 页脚清单
   ============================================================================= */
.front {
  margin-bottom: var(--sp-12);
}
.front__top {
  display: flex;
  align-items: center;
  gap: var(--sp-6);
}
.front h1 {
  margin: 0;
  font-size: calc(var(--fs-h1) + 0.25rem);
  font-weight: 700;
  letter-spacing: var(--tracking-h1);
}
.front__top p {
  margin: var(--sp-2) 0 0;
  font-size: var(--fs-base);
  color: var(--txt-2);
}
.front__facts {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-10);
  margin: var(--sp-10) 0 0;
  padding: var(--sp-6) 0;
  list-style: none;
  border-block: 1px solid var(--line);
}
.front__facts li {
  display: flex;
  align-items: baseline;
  gap: var(--sp-3);
}
.front__k {
  font-size: var(--fs-title);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.front__v {
  font-size: var(--fs-label);
  color: var(--txt-3);
}

.flow {
  margin: 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: var(--sp-5);
}
.flow__step {
  display: flex;
  gap: var(--sp-5);
  padding-bottom: var(--sp-5);
  border-bottom: 1px solid var(--line);
}
.flow__step:last-child {
  padding-bottom: 0;
  border-bottom: 0;
}
.flow__no {
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  flex: none;
  border-radius: 50%;
  background: var(--accent-tint);
  color: var(--pill-brand-text);
  font-size: var(--fs-meta);
  font-weight: 700;
}
.flow__t {
  margin: 0;
  font-size: var(--fs-base);
  font-weight: 600;
}
.flow__d {
  margin: var(--sp-2) 0 0;
  font-size: var(--fs-base);
  color: var(--txt-2);
  line-height: var(--lh-cjk);
}
.flow__d a {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px solid var(--accent-border);
}
.flow__d a:hover {
  border-bottom-color: var(--accent);
}
.flow__d em {
  font-style: normal;
  font-weight: 600;
  color: var(--txt-1);
}

.foot-list {
  margin: var(--sp-4) 0 0;
  padding-inline-start: 18px;
  color: var(--txt-2);
  font-size: var(--fs-base);
  line-height: var(--lh-cjk);
}

/* =============================================================================
   研判台专用：记录条 / 权限闸门 / 任务草案 / 证据链 / 命中规则
   ============================================================================= */
.recbar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: var(--sp-6);
  margin: var(--sp-8) 0 0;
  padding: var(--sp-6) 0 0;
  border-top: 1px solid var(--line);
}
.recbar__value {
  margin-top: var(--sp-2);
  font-size: var(--fs-kpi);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

/* 权限闸门：是/否 只靠文字 + 一个形状标记，不靠颜色 */
.gates {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-3);
  margin-top: var(--sp-4);
}
.gate {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-3);
  height: 26px;
  padding: 0 var(--sp-5);
  border: 1px solid var(--line);
  border-radius: var(--r-control);
  background: var(--bg-raised);
  font-size: var(--fs-label);
  color: var(--txt-2);
}
.gate::before {
  content: '—';
  font-weight: 700;
  color: var(--txt-3);
}
.gate[data-on='1'] {
  border-color: var(--accent-border);
  background: var(--accent-tint);
  color: var(--pill-brand-text);
}
.gate[data-on='1']::before {
  content: '✓';
  color: currentColor;
}

/* 任务草案：状态用左侧细条 + 文字标签，禁用态明确说明原因 */
.taskcard {
  padding: var(--sp-6);
  border: 1px solid var(--line);
  border-left: 3px solid var(--txt-3);
  border-radius: var(--r-card);
  background: var(--bg-card);
}
.taskcard[data-state='proposed'] {
  border-left-color: var(--accent);
}
.taskcard[data-state='confirmed'] {
  border-left-color: var(--state-green);
}
.taskcard[data-state='modified'] {
  border-left-color: var(--line-strong);
}
.taskcard[data-state='rejected'] {
  border-left-color: var(--line-strong);
  background: var(--bg-raised);
}
.taskcard__head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--sp-6);
}
.taskcard__title {
  margin: 0;
  font-size: var(--fs-base);
  font-weight: 600;
}
.taskcard__meta {
  margin: var(--sp-2) 0 0;
  font-size: var(--fs-label);
  color: var(--txt-3);
}
.taskcard__acts {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-3);
  margin-top: var(--sp-5);
  padding-top: var(--sp-5);
  border-top: 1px solid var(--line);
}
.taskcard__foot {
  margin-inline-start: auto;
  font-size: var(--fs-meta);
  color: var(--txt-3);
}

/* 证据链：节点用胶囊串起来，箭头是文字符号 */
.chain {
  padding: var(--sp-5);
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  background: var(--bg-raised);
}
.chain__nodes {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--sp-3);
}
.chain__node {
  display: inline-flex;
  align-items: center;
  height: 24px;
  padding: 0 var(--sp-4);
  border: 1px solid var(--accent-border);
  border-radius: var(--r-pill);
  background: var(--bg-card);
  font-size: var(--fs-meta);
  font-weight: 600;
  color: var(--pill-brand-text);
}
.chain__arrow {
  font-size: var(--fs-meta);
  color: var(--txt-3);
}
.chain__reason {
  margin: var(--sp-4) 0 0;
  font-size: var(--fs-label);
  color: var(--txt-2);
  line-height: var(--lh-cjk);
}

/* 命中规则：左侧竖线，不用整块底色 */
.rule {
  padding-inline-start: var(--sp-5);
  border-left: 2px solid var(--accent-border);
}
.rule__name {
  margin: 0;
  font-size: var(--fs-base);
  font-weight: 600;
}
.rule__msg {
  margin: var(--sp-2) 0 0;
  font-size: var(--fs-label);
  color: var(--txt-2);
  line-height: var(--lh-cjk);
}

/* 案例卡：等级用左侧细条，事实区用定义列表对齐数字 */
.casecard {
  display: flex;
  flex-direction: column;
  gap: var(--sp-5);
  padding: var(--sp-6);
  border: 1px solid var(--line);
  border-left: 3px solid var(--txt-3);
  border-radius: var(--r-card);
  background: var(--bg-card);
}
.casecard[data-level='green'] {
  border-left-color: var(--state-green);
}
.casecard[data-level='yellow'] {
  border-left-color: var(--state-yellow);
}
.casecard[data-level='orange'] {
  border-left-color: var(--state-orange);
}
.casecard[data-level='red'] {
  border-left-color: var(--state-red);
}
.casecard__head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--sp-5);
}
.casecard__name {
  margin: 0;
  font-size: var(--fs-base);
  font-weight: 700;
}
.casecard__meta {
  margin: var(--sp-2) 0 0;
  font-size: var(--fs-label);
  color: var(--txt-3);
}
.casecard__facts {
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
  margin: 0;
  padding-top: var(--sp-5);
  border-top: 1px solid var(--line);
}
.casecard__facts > div {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-4);
}
.casecard__facts dt {
  font-size: var(--fs-label);
  color: var(--txt-3);
}
.casecard__facts dd {
  margin: 0;
  font-size: var(--fs-label);
  font-weight: 600;
  color: var(--txt-2);
}
.casecard__acts {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-3);
  margin-top: auto;
}


/* ---------- 登录页：无外壳，左右分栏 ---------- */
.auth {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 430px);
  min-height: 100vh;
}
.auth__aside {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: var(--sp-8);
  padding: var(--sp-16) var(--sp-12);
  background: var(--bg-raised);
  border-right: 1px solid var(--line);
}
.auth__main {
  display: grid;
  place-items: center;
  padding: var(--sp-12) var(--sp-8);
}
.auth__form {
  width: 100%;
  max-width: 360px;
}
.auth__points {
  margin: 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: var(--sp-5);
}
.auth__points li {
  display: flex;
  gap: var(--sp-4);
  font-size: var(--fs-base);
  color: var(--txt-2);
}
.auth__points svg {
  width: 16px;
  height: 16px;
  margin-top: 3px;
  flex: none;
  color: var(--accent);
}
@media (max-width: 900px) {
  .auth {
    grid-template-columns: minmax(0, 1fr);
  }
  .auth__aside {
    display: none;
  }
}
.demoacct {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-4);
  width: 100%;
  min-height: 34px;
  padding: 0 var(--sp-5);
  border: 1px solid var(--line);
  border-radius: var(--r-control);
  background: var(--bg-raised);
  color: var(--txt-2);
  font-size: var(--fs-label);
  cursor: pointer;
  transition:
    border-color var(--d-base) ease,
    color var(--d-base) ease;
}
.demoacct:hover {
  border-color: var(--accent-border);
  color: var(--txt-1);
}
.demoacct code {
  font-family: var(--font-mono);
  font-size: 0.95em;
  color: var(--txt-1);
}

/* 滚动条：细、无冲击 */
* {
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
}
*::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}
*::-webkit-scrollbar-thumb {
  background: var(--line-strong);
  border: 3px solid transparent;
  border-radius: var(--r-pill);
  background-clip: content-box;
}

/* 减动效：用 0.001ms 而非 none（否则 animationend 不触发），并显式写终态 */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}


/* =============================================================================
   shell.css · 应用外壳
   双基调在这里体现：
     · 管理端 = 深色外壳（ink）+ 浅/深内容面 —— 「克制、可信」
     · 个人端 = 全暖浅（外壳与内容同一暖色系，靠 1px 描边分区）—— 「温和、有人味」
   两者共用同一套 token 与同一个 accent，不做「一模块一色」。
   ============================================================================= */

.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  min-height: 100vh;
  background: var(--bg-page);
}
.app[data-collapsed='true'] {
  --sidebar-w: var(--sidebar-w-collapsed);
}

/* ---------- 侧栏 ------------------------------------------------------------ */
.sidebar {
  position: sticky;
  top: 0;
  align-self: start;
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--shell-bg);
  color: var(--shell-fg);
  border-right: 1px solid var(--shell-line);
  overflow: hidden;
}
.brand {
  display: flex;
  align-items: center;
  gap: var(--sp-5);
  height: var(--topbar-h);
  padding: 0 var(--sp-6);
  border-bottom: 1px solid var(--shell-line);
  flex: none;
}
.brand__mark {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  flex: none;
  border-radius: var(--r-control);
  background: var(--accent);
  color: var(--text-on-accent);
}
.brand__mark svg {
  width: 16px;
  height: 16px;
}
.brand__text {
  min-width: 0;
}
.brand__name {
  font-size: var(--fs-base);
  font-weight: 700;
  white-space: nowrap;
}
.brand__sub {
  font-size: var(--fs-meta);
  color: var(--shell-fg-dim);
  white-space: nowrap;
}
.app[data-collapsed='true'] .brand__text,
.app[data-collapsed='true'] .nav-link__text,
.app[data-collapsed='true'] .sidebar__foot-text {
  /* 折叠时用裁切而不是 display:none —— 每个链接仍然有可访问名 */
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.nav {
  flex: 1;
  overflow-y: auto;
  padding: var(--sp-6) var(--sp-4) var(--sp-8);
}
.nav__group + .nav__group {
  margin-top: var(--sp-6);
  padding-top: var(--sp-6);
  border-top: 1px solid var(--shell-line);
}
.nav__label {
  padding: 0 var(--sp-4) var(--sp-3);
  font-size: var(--fs-meta);
  font-weight: 600;
  color: var(--shell-fg-muted);
}
.nav-link {
  display: flex;
  align-items: center;
  gap: var(--sp-5);
  min-height: 34px;
  padding: 0 var(--sp-4);
  margin-bottom: 2px;
  border-left: 3px solid transparent; /* 每行都预留，选中时才上色 */
  border-radius: 0 var(--r-chrome) var(--r-chrome) 0;
  color: var(--shell-fg-dim);
  font-size: var(--fs-base);
  font-weight: 500;
  transition:
    background var(--d-base) ease,
    color var(--d-base) ease;
}
.nav-link:hover {
  background: var(--shell-hover);
  color: var(--shell-fg);
  text-decoration: none;
}
.nav-link[aria-current='page'] {
  background: var(--shell-active);
  border-left-color: var(--accent);
  color: var(--shell-fg);
  font-weight: 600;
}
.nav-link svg {
  width: 16px;
  height: 16px;
  flex: none;
}
.nav-link__text {
  white-space: nowrap;
}
.nav-link__count {
  margin-inline-start: auto;
  font-size: var(--fs-meta);
  font-variant-numeric: tabular-nums;
  color: var(--shell-fg-muted);
}
.sidebar__foot {
  flex: none;
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  padding: var(--sp-5) var(--sp-6);
  border-top: 1px solid var(--shell-line);
}
.sidebar__foot-text {
  font-size: var(--fs-meta);
  color: var(--shell-fg-muted);
  line-height: 1.5;
  /* 原来是 nowrap + 省略号，手机上会截成「每一次记录，都是对自己的关…」；改为折行 */
  white-space: normal;
  overflow-wrap: anywhere;
}
.sidebar__foot .iconbtn {
  margin-inline-start: auto;
  background: transparent;
  border-color: var(--shell-line);
  color: var(--shell-fg-dim);
}
.sidebar__foot .iconbtn:hover {
  background: var(--shell-hover);
  color: var(--shell-fg);
}
.app[data-collapsed='true'] .sidebar__foot {
  justify-content: center;
  padding-inline: 0;
}
.app[data-collapsed='true'] .sidebar__foot .iconbtn {
  margin-inline-start: 0;
}

/* ---------- 主区 ------------------------------------------------------------ */
.main {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: var(--sp-6);
  height: var(--topbar-h);
  flex: none;
  padding: 0 var(--sp-10);
  background: var(--shell-bg);
  color: var(--shell-fg);
  border-bottom: 1px solid var(--shell-line);
  box-shadow: inset 0 2px 0 0 var(--accent);
}
.crumbs {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  font-size: var(--fs-label);
  color: var(--shell-fg-muted);
  min-width: 0;
}
.crumbs a {
  color: inherit;
}
.crumbs a:hover {
  color: var(--shell-fg);
}
.crumbs__sep {
  opacity: 0.6;
}
.crumbs__now {
  color: var(--shell-fg);
  font-weight: 600;
}
.topbar__spacer {
  flex: 1;
}
.topbar .iconbtn {
  background: transparent;
  border-color: var(--shell-line);
  color: var(--shell-fg-dim);
}
.topbar .iconbtn:hover {
  background: var(--shell-hover);
  color: var(--shell-fg);
}
.userbtn {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  min-height: 34px;
  padding: 0 var(--sp-4) 0 var(--sp-2);
  border: 1px solid var(--shell-line);
  border-radius: var(--r-pill);
  background: transparent;
  cursor: pointer;
  text-align: start;
  transition: background var(--d-base) ease;
}
.userbtn:hover {
  background: var(--shell-hover);
}
.userbtn__name {
  font-size: var(--fs-label);
  font-weight: 600;
  color: var(--shell-fg);
  line-height: 1.2;
}
.userbtn__role {
  font-size: var(--fs-meta);
  color: var(--shell-fg-muted);
  line-height: 1.2;
}
.userbtn .avatar {
  width: 26px;
  height: 26px;
}
.topbar__divider {
  width: 1px;
  height: 22px;
  background: var(--shell-line);
}

.content {
  flex: 1;
  padding: var(--sp-8) var(--sp-10) var(--sp-16);
}
.content__inner {
  max-width: var(--content-max);
  margin: 0 auto;
}
.content__inner--form {
  max-width: var(--content-max-form);
  margin: 0 auto;
}

/* 页头：标题 + 一段说明 + 右侧主操作 */
.pagehead {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--sp-8);
  margin-bottom: var(--sp-6);
}
.pagehead__desc {
  margin: var(--sp-2) 0 0;
  font-size: var(--fs-base);
  color: var(--txt-2);
  max-width: 58ch;
  line-height: var(--lh-base);
}
.pagehead__actions {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  flex: none;
}

/* ---------- 外壳配色：跟随模式，与现有前端一致 -------------------------------
   浅色模式 = 浅外壳（白/浅灰），深色模式 = 深外壳；两端共用同一套，不做「一模块一色」。 */
[data-surface] {
  --shell-bg: var(--bg-card);
  --shell-line: var(--line);
  --shell-fg: var(--txt-1);
  --shell-fg-dim: var(--txt-2);
  --shell-fg-muted: var(--txt-3);
  --shell-hover: var(--hover-surface);
  --shell-active: var(--accent-tint);
}
/* 挂在顶栏上的下拉与 tooltip 仍是「内容色」 */
.popover {
  background: var(--bg-card);
  color: var(--txt-1);
  border-color: var(--line);
}

/* ---------- 浮动层：外壳永不用阴影，只有真正浮动的元素用 ------------------- */
.popover {
  position: absolute;
  min-width: 200px;
  padding: var(--sp-4);
  border: 1px solid var(--line);
  border-radius: var(--r-float);
  background: var(--bg-card);
  color: var(--txt-1);
  box-shadow: var(--shadow-float);
  z-index: 40;
}
.popover__item {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  width: 100%;
  min-height: 32px;
  padding: 0 var(--sp-4);
  border: 0;
  border-radius: var(--r-control);
  background: transparent;
  color: var(--txt-2);
  font-size: var(--fs-base);
  text-align: start;
  cursor: pointer;
}
.popover__item:hover {
  background: var(--hover-surface);
  color: var(--txt-1);
}
.popover__item svg {
  width: 15px;
  height: 15px;
}

/* ---------- 移动端：侧栏收成抽屉 -------------------------------------------- */
.topbar__menu {
  display: none;
}
@media (max-width: 1023px) {
  .app {
    grid-template-columns: minmax(0, 1fr);
  }
  .sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    width: var(--sidebar-w);
    max-width: 82vw;
    transform: translateX(-100%);
    transition: transform var(--d-move) var(--ease-move);
    z-index: 50;
  }
  .app[data-mobile-open='true'] .sidebar {
    transform: none;
    box-shadow: var(--shadow-float);
    /* 抽屉下要能看出「下面是页面」，靠一条分隔边而不是投影堆叠 */
    border-right: 1px solid var(--shell-line);
  }
  .topbar__menu {
    display: inline-flex;
  }
  .content {
    padding: var(--sp-6) var(--sp-6) var(--sp-12);
  }
  .topbar {
    padding: 0 var(--sp-6);
  }
  .pagehead {
    align-items: flex-start;
    flex-direction: column;
  }
}
@media (min-width: 1024px) {
  .app[data-collapsed='true'] .brand {
    justify-content: center;
    padding-inline: 0;
  }
  .app[data-collapsed='true'] .nav__label {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  .app[data-collapsed='true'] .nav-link {
    justify-content: center;
    padding-inline: 0;
    border-radius: var(--r-chrome);
    margin-inline: var(--sp-2);
  }
  .app[data-collapsed='true'] .nav-link__count {
    display: none;
  }
}

/* 单文件版专用：换页时给舞台一个最小高度，避免切换瞬间滚动条跳动 */
#stage:empty { display: block; min-height: 60vh; }
.bundlebar { position: fixed; inset-inline: 0; bottom: 0; z-index: 90; display: flex; align-items: center; gap: 8px;
  padding: 7px 12px; background: var(--bg-card); border-top: 1px solid var(--line); font-size: var(--fs-meta); color: var(--txt-3);
  flex-wrap: nowrap; }
.bundlebar__pill { flex: none; max-width: 34vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  padding: 2px 8px; border: 1px solid var(--line); border-radius: var(--r-chrome); color: var(--txt-2); }
.bundlebar__spacer { margin-inline-start: auto; }
.bundlebar button { flex: none; font: inherit; color: var(--accent); background: none; border: 0; cursor: pointer; padding: 2px 3px; white-space: nowrap; }
/* 手机上这条工具条不该占掉两行：说明文字直接隐藏，按钮改用短标签 */
@media (max-width: 560px) {
  .bundlebar { padding: 6px 10px; gap: 6px; }
  .bundlebar #bb-hint { display: none; }
  .bundlebar button { padding: 2px; }
}
/* 工具条是 fixed 的，给内容留出高度，别压住最后一屏 */
body { padding-bottom: 38px; }
.bb-short { display: none; }
@media (max-width: 560px) {
  .bb-full { display: none; }
  .bb-short { display: inline; }
}
.shotgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--sp-7, 14px); }
.shotgrid figure { margin: 0; border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; background: var(--bg-card); }
.shotgrid img { display: block; width: 100%; height: auto; background: var(--bg-inset); }
.shotgrid figcaption { padding: 8px 10px; font-size: var(--fs-label); color: var(--txt-2); border-top: 1px solid var(--line); }
</style>
</head>

                <div class=\"rowitem__meta\">PHQ-9 得分 18 (≥15) · 处置中</div>\n                </div>\n                <a class=\"btn btn--sm\" href=\"#/pages/admin-alerts.html\">去处置</a>\n              </div>\n            </div>\n\n            <div class=\"note note--warn\" style=\"margin-top:var(--sp-6)\">\n              <div class=\"note__body\">\n                <p class=\"note__title\">命中红色升级条件</p>\n                <p>总分 18 落在中重度段（≥15），且第 9 题（自伤念头）为阳性应答，按规则一律升级为红色并进入人工复核队列。请按危机应对流程跟进，不要仅依赖系统分级。</p>\n              </div>\n            </div>\n\n            <details class=\"tech\">\n              <summary>技术详情（计分与预警来源）</summary>\n              <dl class=\"dl\">\n                <dt>记录编号</dt><dd class=\"mono\">SCR-001</dd>\n                <dt>量表编号</dt><dd class=\"mono\">PHQ-9</dd>\n                <dt>分级规则</dt><dd>总分 ≥ 15 生成橙色；第 9 题 ≥ 1 一律升级为红色</dd>\n                <dt>数据来源</dt><dd>作答记录表（含每题得分与作答时间戳）</dd>\n              </dl>\n            </details>\n          </section>\n        </div>\n\n        <p class=\"dim\" style=\"margin-top:var(--sp-12);font-size:var(--fs-meta)\">\n          原型样张 · 8 条记录、得分与咨询师取自 <span class=\"mono\">adminMockData.ts</span> 的\n          <span class=\"mono\">screeningRecords</span>；筛选维度沿用 <span class=\"mono\">AdminScreening.tsx</span>\n          （搜索姓名/编号 + 等级），并按审查结论补齐两处：空态区分「无数据」与「筛选无结果」、空行\n          <span class=\"mono\">colSpan</span> 与表头列数一致（8 列）\n        </p>\n      </div>\n    </main>\n  </div>\n</div>","pages/login.html":"<\u0021-- 没有顶栏，主题切换做成右上角浮动按钮 -->\n<button class=\"iconbtn\" type=\"button\" data-mode-toggle aria-label=\"切换为深色模式\" aria-pressed=\"false\" title=\"切换为深色模式\"\n        style=\"position:fixed;top:16px;right:16px;z-index:30\">\n  <span data-icon=\"sun\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"/></svg></span>\n  <span data-icon=\"moon\" hidden><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20.9 12.5A8.5 8.5 0 1 1 11.5 3.1a6.6 6.6 0 0 0 9.4 9.4Z\"/></svg></span>\n</button>\n\n<div class=\"auth\">\n  <\u0021-- 左栏：品牌与卖点（不用渐变、不用插画堆砌） -->\n  <aside class=\"auth__aside\">\n    <div class=\"inline\" style=\"gap:var(--sp-5)\">\n      <span class=\"brand__mark\" aria-hidden=\"true\" style=\"width:34px;height:34px\">\n        <svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12h3l2.5-7 3 14 2.5-7h6\"/></svg>\n      </span>\n      <span>\n        <span style=\"display:block;font-size:var(--fs-title);font-weight:700\">心理筛查预警系统</span>\n        <span class=\"dim\" style=\"font-size:var(--fs-label)\">基于动态跨模态哈希检索和 RAG</span>\n      </span>\n    </div>\n\n    <h1 style=\"font-size:1.75rem;max-width:22ch\">从一次自我了解开始，<br>让关注早一点到达。</h1>\n\n    <ul class=\"auth__points\">\n      <li>\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/></svg>\n        <span><strong>多模态采集</strong>：文字、语音、图像统一记录，量表之外的线索也留得住。</span>\n      </li>\n      <li>\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/></svg>\n        <span><strong>跨模态哈希检索</strong>：64 位码空间里找相似历史模式，毫秒级、可解释。</span>\n      </li>\n      <li>\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/></svg>\n        <span><strong>RAG 风险解释</strong>：结论有据可查，只做风险提示与转介建议，不构成诊断。</span>\n      </li>\n    </ul>\n\n    <p class=\"dim\" style=\"font-size:var(--fs-meta);max-width:44ch;margin:0\">\n      本页面为高保真原型样张，用于展示界面与主要功能，非真实系统。\n    </p>\n  </aside>\n\n  <\u0021-- 右栏：登录表单 -->\n  <main class=\"auth__main\">\n    <div class=\"auth__form\">\n      <h2 style=\"font-size:var(--fs-h1)\">登录账号</h2>\n      <p class=\"muted\" style=\"margin:var(--sp-3) 0 var(--sp-8);font-size:var(--fs-base)\">使用学校统一发放的账号登录</p>\n\n      <form class=\"stack\" style=\"gap:var(--sp-6)\" onsubmit=\"return false\">\n        <label class=\"field\">\n          <span>用户名</span>\n          <input id=\"acct-user\" type=\"text\" value=\"xiaoyu\" autocomplete=\"username\">\n        </label>\n        <label class=\"field\">\n          <span>密码</span>\n          <input id=\"acct-pass\" type=\"password\" value=\"123456\" autocomplete=\"current-password\">\n        </label>\n\n        <div class=\"spread\">\n          <label class=\"inline\" style=\"gap:var(--sp-3);font-size:var(--fs-label);color:var(--txt-2);cursor:pointer\">\n            <input type=\"checkbox\" checked style=\"width:15px;height:15px;accent-color:var(--accent)\">\n            记住我\n          </label>\n          <a href=\"#\" style=\"font-size:var(--fs-label)\">忘记密码？</a>\n        </div>\n\n        <button class=\"btn btn--primary btn--lg\" type=\"button\">登录</button>\n      </form>\n\n      <div class=\"inline\" style=\"gap:var(--sp-5);margin:var(--sp-8) 0\">\n        <span style=\"flex:1;height:1px;background:var(--line)\"></span>\n        <span class=\"dim\" style=\"font-size:var(--fs-meta)\">演示账号（点击自动填充）</span>\n        <span style=\"flex:1;height:1px;background:var(--line)\"></span>\n      </div>\n\n      <div class=\"stack stack--tight\">\n        <button class=\"demoacct\" type=\"button\" data-acct=\"xiaoyu\" data-pw=\"123456\">\n          <span>个人端 · 学生</span><span><code>xiaoyu / 123456</code></span>\n        </button>\n        <button class=\"demoacct\" type=\"button\" data-acct=\"admin\" data-pw=\"admin123\">\n          <span>管理端 · 咨询师</span><span><code>admin / admin123</code></span>\n        </button>\n      </div>\n\n      <p class=\"dim\" style=\"font-size:var(--fs-meta);margin-top:var(--sp-8)\">\n        首次使用？<a href=\"#\">创建账号</a> · 登录即表示同意\n        <a href=\"#\">数据使用说明</a>与<a href=\"#\">隐私政策</a>\n      </p>\n      <p class=\"dim\" style=\"font-size:var(--fs-meta);margin-top:var(--sp-3)\">\n        原型演示可直接 <a href=\"#/pages/system-selector.html\">选择系统</a>，跳过登录。\n      </p>\n    </div>\n  </main>\n</div>","pages/personal-alerts.html":"<div class=\"app\" data-shell='{\"surface\":\"personal\",\"active\":\"alerts\",\"crumb\":\"预警中心\"}'>\n  <aside class=\"sidebar\" data-shell-sidebar></aside>\n  <div class=\"main\">\n    <header class=\"topbar\" data-shell-topbar></header>\n    <main class=\"content\">\n      <div class=\"content__inner\">\n\n        <div class=\"pagehead\">\n          <div>\n            <h1>预警中心</h1>\n            <p class=\"pagehead__desc\">当模型检测到「情绪持续下行、压力过载或睡眠显著下降」时，会在这里推送分级预警与可执行建议。</p>\n          </div>\n          <div class=\"pagehead__actions\">\n            <button class=\"btn\" type=\"button\">\n              <svg viewBox=\"0 0 24 24\" width=\"15\" height=\"15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12a9 9 0 0 1 15-6.7L21 8M21 12a9 9 0 0 1-15 6.7L3 16\"/><path d=\"M21 4v4h-4M3 20v-4h4\"/></svg>\n              刷新\n            </button>\n          </div>\n        </div>\n\n        <div class=\"grid\">\n          <div class=\"tiles\">\n            <div class=\"tile\">\n              <div class=\"tile__label\">本月预警</div>\n              <div class=\"tile__value\">2 <small>条</small></div>\n              <div class=\"tile__sub\">1 条跟踪中 · 1 条已缓解</div>\n            </div>\n            <div class=\"tile\">\n              <div class=\"tile__label\">当前关注级别</div>\n              <div class=\"tile__value\" style=\"font-size:var(--fs-title)\"><span class=\"pill pill--red\"><span class=\"pill__dot\"></span>红色</span></div>\n              <div class=\"tile__sub\">3 月 18 日触发 · 已转人工复核</div>\n            </div>\n            <div class=\"tile\">\n              <div class=\"tile__label\">最近一次筛查</div>\n              <div class=\"tile__value\">15 <small>/ 27</small></div>\n              <div class=\"tile__sub\">PHQ-9 · 中重度段 · 03-18</div>\n            </div>\n            <div class=\"tile\">\n              <div class=\"tile__label\">咨询师跟进</div>\n              <div class=\"tile__value\" style=\"font-size:var(--fs-title)\">03-21 <small>14:00</small></div>\n              <div class=\"tile__sub\">已确认 · 校心理健康教育中心</div>\n            </div>\n          </div>\n\n          <div class=\"grid grid--sidebar\">\n            <div class=\"stack\" style=\"gap:var(--sp-6)\">\n              <section class=\"card\">\n                <div class=\"card__head card__head--tight\">\n                  <div>\n                    <h2 class=\"card__title\">预警记录</h2>\n                    <p class=\"card__desc\">按时间倒序 · 状态由你或咨询师更新，每次变更都会留痕</p>\n                  </div>\n                  <div class=\"inline\" style=\"gap:var(--sp-3)\">\n                    <div class=\"chips\" data-chipgroup role=\"group\" aria-label=\"按级别筛选\">\n                      <button class=\"chip\" type=\"button\" aria-pressed=\"true\">全部级别</button>\n                      <button class=\"chip\" type=\"button\" aria-pressed=\"false\">红色</button>\n                      <button class=\"chip\" type=\"button\" aria-pressed=\"false\">橙色</button>\n                      <button class=\"chip\" type=\"button\" aria-pressed=\"false\">黄色</button>\n                    </div>\n                    <div class=\"chips\" data-chipgroup role=\"group\" aria-label=\"按状态筛选\">\n                      <button class=\"chip\" type=\"button\" aria-pressed=\"true\">全部状态</button>\n                      <button class=\"chip\" type=\"button\" aria-pressed=\"false\">待处理</button>\n                      <button class=\"chip\" type=\"button\" aria-pressed=\"false\">跟踪中</button>\n                      <button class=\"chip\" type=\"button\" aria-pressed=\"false\">已缓解</button>\n                    </div>\n                  </div>\n                </div>\n\n                <\u0021-- ---------- 红色：需要立即行动 ---------- -->\n                <article class=\"alertcard\" data-level=\"red\" data-status=\"tracking\">\n                  <div class=\"inline\" style=\"gap:var(--sp-3)\">\n                    <span class=\"pill pill--red\"><span class=\"pill__dot\"></span>红色预警</span>\n                    <span class=\"pill\">跟踪中</span>\n                    <span class=\"dim\" style=\"font-size:var(--fs-meta)\">触发于 2026-03-18 23:10 · 3 天前</span>\n                  </div>\n                  <h3 class=\"alertcard__title\" style=\"margin:var(--sp-4) 0 0\">连续负性情绪 + 睡眠下降</h3>\n                  <p class=\"alertcard__body\">\n                    近 7 天的情绪均值从 62 降到 45，睡眠从 6.8 小时降到 5.1 小时；\n                    同时命中历史「期中周压力—睡眠下降—情绪低落」模式（相似度 0.92）。\n                  </p>\n                  <div class=\"note note--care\" style=\"margin-top:var(--sp-5)\">\n                    <div class=\"note__body\">\n                      <p class=\"note__title\">现在可以做的一件事</p>\n                      <p>\n                        今天完成一次危机自评，并联系一位你信任的人陪你待一会儿。\n                        如果需要立刻有人说话：24 小时心理援助热线 <span class=\"mono\" style=\"font-weight:700\">12356</span>；\n                        有立即危险时拨打 <span class=\"mono\" style=\"font-weight:700\">120</span>。\n                      </p>\n                    </div>\n                  </div>\n                  <div class=\"alertcard__acts\">\n                    <button class=\"btn btn--sm btn--primary\" type=\"button\">联系咨询师</button>\n                    <button class=\"btn btn--sm\" type=\"button\">开始危机自评</button>\n                    <button class=\"btn btn--sm\" type=\"button\">记一条情绪日记</button>\n                    <span class=\"alertcard__foot\">已同步给值班咨询师 · 03-18 23:12</span>\n                  </div>\n                </article>\n\n                <\u0021-- ---------- 橙色：需要安排 ---------- -->\n                <article class=\"alertcard\" data-level=\"orange\" data-status=\"new\">\n                  <div class=\"inline\" style=\"gap:var(--sp-3)\">\n                    <span class=\"pill pill--orange\"><span class=\"pill__dot\"></span>橙色预警</span>\n                    <span class=\"pill\">待处理</span>\n                    <span class=\"dim\" style=\"font-size:var(--fs-meta)\">触发于 2026-03-16 09:20 · 5 天前</span>\n                  </div>\n                  <h3 class=\"alertcard__title\" style=\"margin:var(--sp-4) 0 0\">焦虑水平持续偏高</h3>\n                  <p class=\"alertcard__body\">\n                    GAD-7 得分 13（中度），语音样本的语速偏慢、停顿增多；\n                    近两周共 5 次记录提到「担心来不及」。\n                  </p>\n                  <div class=\"note\" style=\"margin-top:var(--sp-5)\">\n                    <div class=\"note__body\">\n                      <p class=\"note__title\">系统建议</p>\n                      <p>进行 10 分钟呼吸训练，并把学习任务拆成 25 分钟的番茄钟；本周内预约一次咨询。</p>\n                    </div>\n                  </div>\n                  <div class=\"alertcard__acts\">\n                    <button class=\"btn btn--sm\" type=\"button\">标记为跟踪中</button>\n                    <button class=\"btn btn--sm\" type=\"button\">标记为已缓解</button>\n                    <button class=\"btn btn--sm btn--ghost\" type=\"button\">看依据</button>\n                    <span class=\"alertcard__foot\">未处理 <span class=\"num\">5</span> 天</span>\n                  </div>\n                </article>\n\n                <\u0021-- ---------- 黄色：已缓解，保留过程 ---------- -->\n                <article class=\"alertcard\" data-level=\"yellow\" data-status=\"resolved\">\n                  <div class=\"inline\" style=\"gap:var(--sp-3)\">\n                    <span class=\"pill pill--yellow\"><span class=\"pill__dot\"></span>黄色预警</span>\n                    <span class=\"pill\">已缓解</span>\n                    <span class=\"dim\" style=\"font-size:var(--fs-meta)\">触发于 2026-03-12 · 缓解于 2026-03-19</span>\n                  </div>\n                  <h3 class=\"alertcard__title\" style=\"margin:var(--sp-4) 0 0\">睡眠中断风险</h3>\n                  <p class=\"alertcard__body\">\n                    ISI 得分 17（中度失眠），入睡时间连续 4 天晚于 01:30。\n                    调整后本周入睡时间回到 23:50 前后，已由咨询师确认缓解。\n                  </p>\n                  <div class=\"alertcard__acts\">\n                    <button class=\"btn btn--sm btn--ghost\" type=\"button\">查看处理过程</button>\n                    <span class=\"alertcard__foot\">缓解用时 <span class=\"num\">7</span> 天 · 由 咨询师 A 确认</span>\n                  </div>\n                </article>\n\n                <details class=\"tech\">\n                  <summary>技术详情（分级阈值与触发链路）</summary>\n                  <dl class=\"dl\">\n                    <dt>分级来源</dt><dd>量表总分（PHQ-9 / GAD-7 / ISI / PSS-10）+ 情绪与睡眠趋势 + 跨模态检索命中</dd>\n                    <dt>红色</dt><dd>PHQ-9 ≥ 15 且情绪下行 ≥ 7 天，或第 9 题 ≥ 1；进入人工复核队列</dd>\n                    <dt>橙色</dt><dd>PHQ-9 ≥ 10，或 GAD-7 ≥ 10，或命中高相似负性模式</dd>\n                    <dt>黄色</dt><dd>单项量表进入中度段，或趋势连续 3 天恶化</dd>\n                    <dt>绿色</dt><dd>无异常；仅记录不推送</dd>\n                    <dt>状态机</dt><dd class=\"mono\">new → tracking → resolved</dd>\n                    <dt>同步方式</dt><dd>状态变更先本地乐观更新，失败则回滚并明确提示</dd>\n                  </dl>\n                </details>\n              </section>\n            </div>\n\n            <\u0021-- ================= 侧栏：把「不只是看」的出口放这里 ================= -->\n            <div class=\"stack\" style=\"gap:var(--sp-6)\">\n              <section class=\"card card--tight\">\n                <div class=\"eyebrow\">为什么你会看到这些</div>\n                <p class=\"dim\" style=\"margin:var(--sp-3) 0 0;font-size:var(--fs-base);line-height:var(--lh-cjk)\">\n                  预警只依据你的量表得分、每日记录与已审核的知识库条目生成。\n                  原始身份信息在进入模型前已做假名化，系统被明确禁止给出诊断结论。\n                </p>\n                <p class=\"dim\" style=\"margin:var(--sp-4) 0 0;font-size:var(--fs-meta)\">\n                  最近一次评估：2026-03-18 23:10 · 版本 <span class=\"mono\">al
