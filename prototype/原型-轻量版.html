um / low</span> 三档），与下面五段色带的粒度不一致，属已知问题。\n          </p>\n        </section>\n\n        <div class=\"grid grid--sidebar\">\n          <div class=\"stack\" style=\"gap:var(--sp-6)\">\n            <\u0021-- ============ 三节正文（真实 sections 字段） ============ -->\n            <section class=\"card\">\n              <div class=\"card__head card__head--tight\">\n                <div>\n                  <h2 class=\"card__title\">分析正文</h2>\n                  <p class=\"card__desc\">三节分别回答「变化是什么」「为什么这样判断」「接下来做什么」</p>\n                </div>\n              </div>\n\n              <ol class=\"report\">\n                <li class=\"report__item\">\n                  <div class=\"report__rail\"><div class=\"report__step num\">1</div></div>\n                  <div class=\"report__main\">\n                    <h3 class=\"report__title\">量表变化趋势</h3>\n                    <p class=\"report__body\">\n                      PHQ-9 从 9 分上升到 15 分，GAD-7 从 8 分上升到 13 分，提示抑郁和焦虑并行波动。\n                      近 10 天情绪评分持续低于 55，属于需重点关注区间。\n                    </p>\n                    <div class=\"inline\" style=\"gap:var(--sp-3);margin-top:var(--sp-5)\">\n                      <span class=\"tag\">PHQ-9 +6</span>\n                      <span class=\"tag\">GAD-7 +5</span>\n                      <span class=\"tag\">情绪均值 51</span>\n                    </div>\n                  </div>\n                </li>\n\n                <li class=\"report__item\">\n                  <div class=\"report__rail\"><div class=\"report__step num\">2</div></div>\n                  <div class=\"report__main\">\n                    <h3 class=\"report__title\">动态跨模态哈希匹配</h3>\n                    <p class=\"report__body\">\n                      文本、语音、图像三类信号在哈希空间中与高相似案例的平均相似度达到 0.83，\n                      且语音与文本的一致性较高。模型提示「压力-睡眠-情绪」链式反应明显。\n                    </p>\n                    <div class=\"table-wrap\" style=\"margin-top:var(--sp-5)\">\n                      <table class=\"table\">\n                        <caption class=\"sr-only\">本次跨模态命中情况</caption>\n                        <thead>\n                          <tr>\n                            <th scope=\"col\">样本</th>\n                            <th scope=\"col\">模态</th>\n                            <th scope=\"col\" class=\"num\">相似度</th>\n                            <th scope=\"col\">共同主题</th>\n                          </tr>\n                        </thead>\n                        <tbody>\n                          <tr><td class=\"mono\">RET-001</td><td>文本</td><td class=\"num\">0.94</td><td>压力 · 睡眠障碍</td></tr>\n                          <tr><td class=\"mono\">RET-002</td><td>语音</td><td class=\"num\">0.89</td><td>情绪低落 · 消极认知</td></tr>\n                          <tr><td class=\"mono\">RET-003</td><td>文本</td><td class=\"num\">0.85</td><td>焦虑 · 躯体化</td></tr>\n                          <tr><td class=\"mono\">RET-005</td><td>语音</td><td class=\"num\">0.72</td><td>情感抑制</td></tr>\n                        </tbody>\n                      </table>\n                    </div>\n                  </div>\n                </li>\n\n                <li class=\"report__item\">\n                  <div class=\"report__rail\"><div class=\"report__step num\">3</div></div>\n                  <div class=\"report__main\">\n                    <h3 class=\"report__title\">RAG 生成建议</h3>\n                    <p class=\"report__body\">\n                      结合检索到的相似个体恢复路径，最有效策略是：先稳定睡眠，再降低即时压力峰值，\n                      最后逐步恢复社交和学习掌控感。建议按行动计划进行 7 天追踪。\n                    </p>\n                    <div class=\"stack\" style=\"gap:var(--sp-3);margin-top:var(--sp-5)\">\n                      <div class=\"rowitem\">\n                        <div class=\"rowitem__main\">\n                          <div class=\"rowitem__title\">未来 3 天优先保证睡眠时长 ≥ 6.5 小时</div>\n                          <div class=\"rowitem__meta\">最优先 · 与 ISI 17 分直接对应</div>\n                        </div>\n                        <span class=\"pill pill--brand\">第 1 步</span>\n                      </div>\n                      <div class=\"rowitem\">\n                        <div class=\"rowitem__main\">\n                          <div class=\"rowitem__title\">每天固定 1 次 8–12 分钟呼吸或正念练习</div>\n                          <div class=\"rowitem__meta\">降低即时压力峰值</div>\n                        </div>\n                        <span class=\"pill pill--neutral\">第 2 步</span>\n                      </div>\n                      <div class=\"rowitem\">\n                        <div class=\"rowitem__main\">\n                          <div class=\"rowitem__title\">将高压任务拆解为 25 分钟可执行清单</div>\n                          <div class=\"rowitem__meta\">对应「课程压力」与「兴趣缺失」</div>\n                        </div>\n                        <span class=\"pill pill--neutral\">第 3 步</span>\n                      </div>\n                    </div>\n\n                    <div class=\"note note--care\" style=\"margin-top:var(--sp-6)\">\n                      <div class=\"note__body\">\n                        <p class=\"note__title\">出现以下情况请立即联系支持资源</p>\n                        <p>\n                          若出现持续绝望或自伤想法：24 小时心理援助热线\n                          <span class=\"mono\" style=\"font-weight:700\">12356</span>；\n                          校心理健康教育中心（工作日 8:30–17:30）。\n                          有立即危险时拨打 <span class=\"mono\" style=\"font-weight:700\">120</span>，或请身边的人陪着你。\n                        </p>\n                      </div>\n                    </div>\n                  </div>\n                </li>\n              </ol>\n\n              <div class=\"card__foot\">\n                <div class=\"inline\" style=\"gap:var(--sp-4)\">\n                  <button class=\"btn btn--primary\" type=\"button\">采纳并加入行动计划</button>\n                  <button class=\"btn\" type=\"button\">复制全文</button>\n                  <button class=\"btn btn--ghost\" type=\"button\">标记为不准确</button>\n                </div>\n                <p class=\"dim\" style=\"margin:var(--sp-4) 0 0;font-size:var(--fs-meta)\">\n                  标记「不准确」会记录反馈用于后续校准，不会删除本次报告。\n                </p>\n              </div>\n            </section>\n\n            <\u0021-- ============ 可解释性 ============ -->\n            <section class=\"card\">\n              <div class=\"card__head card__head--tight\">\n                <div>\n                  <h2 class=\"card__title\">这份结论是怎么来的</h2>\n                  <p class=\"card__desc\">结论只依据下列输入生成，可逐项核对</p>\n                </div>\n              </div>\n              <div class=\"table-wrap\">\n                <table class=\"table\">\n                  <caption class=\"sr-only\">报告输入来源</caption>\n                  <thead>\n                    <tr>\n                      <th scope=\"col\">输入</th>\n                      <th scope=\"col\">内容</th>\n                      <th scope=\"col\">用途</th>\n                    </tr>\n                  </thead>\n                  <tbody>\n                    <tr>\n                      <td>检索命中样本</td>\n                      <td>RET-001 / 002 / 003 / 005，平均相似度 0.83</td>\n                      <td>提供相似个体的恢复路径</td>\n                    </tr>\n                    <tr>\n                      <td>量表记录</td>\n                      <td>PHQ-9 15 分 · GAD-7 13 分 · ISI 17 分</td>\n                      <td>确定当前所处分段</td>\n                    </tr>\n                    <tr>\n                      <td>知识与资源库</td>\n                      <td>已审核条目 <span class=\"mono\">42</span> 条</td>\n                      <td>生成可执行建议</td>\n                    </tr>\n                    <tr>\n                      <td>被排除的信息</td>\n                      <td>姓名、学号、联系方式等身份字段</td>\n                      <td>进入模型前已假名化</td>\n                    </tr>\n                  </tbody>\n                </table>\n              </div>\n\n              <details class=\"tech\">\n                <summary>技术详情（模型与约束）</summary>\n                <dl class=\"dl\">\n                  <dt>生成方式</dt><dd>检索增强生成（RAG）：先检索相似样本，再以样本 + 知识库为上下文生成</dd>\n                  <dt>检索链路</dt><dd>64 位跨模态哈希 → 非对称距离排序 → 时间窗过滤</dd>\n                  <dt>明确禁止</dt><dd>给出诊断结论、给出用药建议、编造未命中的样本</dd>\n                  <dt>风险等级</dt><dd>由报告字段 <span class=\"mono\">riskLevel</span> 决定，不由前端写死</dd>\n                  <dt>失败处理</dt><dd>报告缺失时只显示检索结果，不渲染等级徽章</dd>\n                </dl>\n              </details>\n            </section>\n          </div>\n\n          <\u0021-- ============ 侧栏 ============ -->\n          <div class=\"stack\" style=\"gap:var(--sp-6)\">\n            <section class=\"card card--tight\">\n              <div class=\"eyebrow\">7 天追踪</div>\n              <p style=\"margin:var(--sp-3) 0 0;font-size:var(--fs-base)\">\n                <span class=\"num\" style=\"font-weight:700\">3</span> / 7 天\n                <span class=\"dim\">· 还有 4 天</span>\n              </p>\n              <div class=\"progress\" style=\"margin-top:var(--sp-5)\"><span class=\"progress__fill\" style=\"--v:43%\"></span></div>\n              <ul style=\"margin:var(--sp-5) 0 0;padding-inline-start:18px;color:var(--txt-2);font-size:var(--fs-base);line-height:var(--lh-cjk)\">\n                <li>03-19 已完成：呼吸放松 12 分钟</li>\n                <li>03-18 已完成：情绪日记 3 条</li>\n                <li>03-17 已完成：睡眠 6.9 小时</li>\n              </ul>\n              <div class=\"card__foot\">\n                <a class=\"btn btn--ghost btn--sm\" href=\"#/pages/personal-home.html\">回到首页看趋势</a>\n              </div>\n            </section>\n\n            <section class=\"card card--tight\">\n              <div class=\"eyebrow\">复核状态</div>\n              <div class=\"rowlist\" style=\"margin-top:var(--sp-5)\">\n                <div class=\"rowitem\">\n                  <div class=\"rowitem__main\">\n                    <div class=\"rowitem__title\">AI 初稿</div>\n                    <div class=\"rowitem__meta\">2026-03-19 08:12 生成</div>\n                  </div>\n                  <span class=\"pill pill--green\">已完成</span>\n                </div>\n                <div class=\"rowitem\">\n                  <div class=\"rowitem__main\">\n                    <div class=\"rowitem__title\">咨询师复核</div>\n                    <div class=\"rowitem__meta\">李老师 · 预计 03-21 面谈时确认</div>\n                  </div>\n                  <span class=\"pill pill--brand\">待复核</span>\n                </div>\n              </div>\n            </section>\n\n            <section class=\"card card--tight\">\n              <div class=\"eyebrow\">报告的边界</div>\n              <ul style=\"margin:var(--sp-4) 0 0;padding-inline-start:18px;color:var(--txt-2);font-size:var(--fs-base);line-height:var(--lh-cjk)\">\n                <li>不是诊断，也不能替代面谈与专业判断</li>\n                <li>建议的优先级来自相似个体的恢复路径，不保证对你同样有效</li>\n                <li>报告与原始记录都可在「管理我的数据」中删除</li>\n              </ul>\n            </section>\n          </div>\n        </div>\n\n        <p class=\"dim\" style=\"margin-top:var(--sp-12);font-size:var(--fs-meta)\">\n          原型样张 · 摘要、三节正文、四条建议与 <span class=\"mono\">recommendations</span> 均逐字取自\n          <span class=\"mono\">mockData.ts</span> 的 <span class=\"mono\">ragReport</span>；\n          四条命中样本取自 <span class=\"mono\">retrievalResults</span>。按审查结论修正：等级徽章读\n          <span class=\"mono\">riskLevel</span> 而非写死「高风险」，报告缺失时不渲染等级\n        </p>\n      </div>\n    </main>\n  </div>\n</div>","pages/personal-retrieval.html":"<div class=\"app\" data-shell='{\"surface\":\"personal\",\"active\":\"retrieval\",\"crumb\":\"检索与分析\"}'>\n  <aside class=\"sidebar\" data-shell-sidebar></aside>\n  <div class=\"main\">\n    <header class=\"topbar\" data-shell-topbar></header>\n    <main class=\"content\">\n      <div class=\"content__inner\">\n\n        <div class=\"pagehead\">\n          <div>\n            <h1>检索与分析</h1>\n            <p class=\"pagehead__desc\">查找相似的历史模式，获取有据可循的分析与建议。三种模态都可以作为查询。</p>\n          </div>\n          <div class=\"pagehead__actions\">\n            <button class=\"btn\" type=\"button\" title=\"导出当前检索结果与报告\">\n              <svg viewBox=\"0 0 24 24\" width=\"15\" height=\"15\" fill=\"none\" stroke var BUNDLE_SCRIPTS = {"pages/admin-agent.html":[],"pages/admin-alerts.html":[],"pages/admin-cases.html":[],"pages/admin-collect.html":["\n(function () {\n  var tabs = Array.prototype.slice.call(document.querySelectorAll('[data-tab]'));\n  var panels = Array.prototype.slice.call(document.querySelectorAll('[data-panel]'));\n  function select(name) {\n    tabs.forEach(function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-tab') === name)); });\n    panels.forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== name; });\n  }\n  tabs.forEach(function (t, i) {\n    t.addEventListener('click', function () { select(t.getAttribute('data-tab')); });\n    t.addEventListener('keydown', function (ev) {\n      if (ev.key !== 'ArrowRight' && ev.key !== 'ArrowLeft') return;\n      ev.preventDefault();\n      var next = tabs[(i + (ev.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];\n      next.focus();\n      select(next.getAttribute('data-tab'));\n    });\n  });\n  var hash = (location.hash || '').replace(/[#,](light|dark)/g, '').replace('#', '');\n  if (hash === 'audio' || hash === 'image') select(hash);\n})();\n"],"pages/admin-dashboard.html":[],"pages/admin-retrieval.html":[],"pages/admin-screenings.html":[],"pages/login.html":["\n/* 演示账号一键填充（原型自包含，不污染 app.js） */\ndocument.querySelectorAll('.demoacct').forEach(function (b) {\n  b.addEventListener('click', function () {\n    document.getElementById('acct-user').value = b.dataset.acct;\n    document.getElementById('acct-pass').value = b.dataset.pw;\n  });\n});\n"],"pages/personal-alerts.html":[],"pages/personal-collect.html":["\n/* 模态切换：真 tablist 语义（aria-selected + hidden），键盘左右键可切换 */\n(function () {\n  var tabs = Array.prototype.slice.call(document.querySelectorAll('[data-tab]'));\n  var panels = Array.prototype.slice.call(document.querySelectorAll('[data-panel]'));\n  function select(name) {\n    tabs.forEach(function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-tab') === name)); });\n    panels.forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== name; });\n  }\n  tabs.forEach(function (t, i) {\n    t.addEventListener('click', function () { select(t.getAttribute('data-tab')); });\n    t.addEventListener('keydown', function (ev) {\n      if (ev.key !== 'ArrowRight' && ev.key !== 'ArrowLeft') return;\n      ev.preventDefault();\n      var next = tabs[(i + (ev.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];\n      next.focus();\n      select(next.getAttribute('data-tab'));\n    });\n  });\n  var hash = (location.hash || '').replace(/[#,](light|dark)/g, '').replace('#', '');\n  if (hash === 'text' || hash === 'image') select(hash);\n})();\n"],"pages/personal-home.html":[],"pages/personal-profile.html":[],"pages/personal-rag.html":[],"pages/personal-retrieval.html":[],"pages/personal-screening.html":["\n/* 原型最小交互：让「一屏一题」真的能翻页 —— 第 3 题 → 第 9 题 → 结果态。\n   只做演示路径，不做完整 9 题状态机（原型评审关心的是节奏与安全题的呈现）。 */\n(function () {\n  var quiz = document.getElementById('quiz');\n  var result = document.getElementById('result');\n  var blocks = quiz.querySelectorAll('[data-question]');\n  var steps = quiz.querySelectorAll('.step');\n  var now = quiz.querySelector('[data-q-now]');\n  var note = quiz.querySelector('[data-q-note]');\n  var nextBtn = quiz.querySelector('.btn--primary');\n  var prevBtn = quiz.querySelector('.btn:not(.btn--primary)');\n  var idx = 0;\n  var answered = [true, true, false, false, false, false, false, false, false];\n  var numbers = [3, 9];\n  /* 截图与评审用：#safety 直接看第 9 题，#result 直接看结果态；\n     片段可能带模式后缀（#safety,light），只取逗号前的部分。 */\n  var hash = (location.hash || '').replace('#', '').split(',')[0];\n  if (hash === 'safety') {\n    idx = 1;\n    /* 安全题答 ≥ 1（第 9 题 = 好几天）：就地留在本题并展开支持信息 */\n    quiz.querySelector('input[name=\"q9\"][value=\"1\"]').checked = true;\n  }\n  if (hash === 'safety') { answered[0] = true; answered[1] = true; }\n\n  function paint() {\n    var q = numbers[idx];\n    blocks.forEach(function (b, i) { b.hidden = i !== idx; });\n    /* 分段条的第 n 段代表第 n 题（原型只演示第 3 题与第 9 题两屏） */\n    steps.forEach(function (s, i) {\n      var n = i + 1;\n      var state = '';\n      if (answered[n - 1]) state = 'done';\n      else if (n === q) state = 'now';\n      s.setAttribute('data-on', state);\n    });\n    now.textContent = String(q);\n    var done = answered.filter(Boolean).length;\n    note.textContent = done === 9 ? '· 9 题已全部作答' : '· 已作答 ' + done + ' 题';\n    var left = quiz.querySelector('[data-unanswered]');\n    if (left) left.textContent = String(9 - done);\n    prevBtn.disabled = idx === 0;\n    nextBtn.textContent = '';\n    nextBtn.appendChild(document.createTextNode(idx === numbers.length - 1 ? '提交并查看结果' : '下一题'));\n    if (idx < numbers.length - 1) {\n      var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');\n      svg.setAttribute('viewBox', '0 0 24 24'); svg.setAttribute('width', '15'); svg.setAttribute('height', '15');\n      svg.setAttribute('fill', 'none'); svg.setAttribute('stroke', 'currentColor');\n      svg.setAttribute('stroke-width', '1.7'); svg.setAttribute('stroke-linecap', 'round'); svg.setAttribute('stroke-linejoin', 'round');\n      svg.innerHTML = '<path d=\"M5 12h14M13 6l6 6-6 6\"/>';\n      nextBtn.appendChild(svg);\n    }\n  }\n\n  /* 选中即记录，并让当前题在分段条上变为已完成 */\n  quiz.addEventListener('change', function (ev) {\n    if (ev.target.type !== 'radio') return;\n    answered[numbers[idx] - 1] = true;\n    paint();\n  });\n\n  nextBtn.addEventListener('click', function () {\n    if (idx === numbers.length - 1) {\n      showResult();\n      window.scrollTo({ top: 0, behavior: 'smooth' });\n      return;\n    }\n    answered[numbers[idx] - 1] = true;\n    idx = Math.min(numbers.length - 1, idx + 1);\n    paint();\n  });\n  function showResult() {\n    answered = answered.map(function () { return true; });    quiz.hidden = true;\n    result.hidden = false;\n    var pill = document.querySelector('[data-state-pill]');\n    var bar = document.querySelector('[data-state-bar]');\n    var note = document.querySelector('[data-state-note]');\n    if (pill) pill.textContent = '已完成';\n    if (bar) bar.style.setProperty('--v', '100%');\n    if (note) note.textContent = '已作答 9 / 9 题 · 3 分 12 秒完成 · 结果已写入个人档案';\n  }\n  function showQuiz() {\n    result.hidden = true;\n    quiz.hidden = false;\n    idx = 0;\n    paint();\n  }  prevBtn.addEventListener('click', function () {\n    idx = Math.max(0, idx - 1);\n    paint();\n  });\n  var restart = document.querySelector('[data-restart]');\n  if (restart) restart.addEventListener('click', function () {\n    showQuiz();\n    window.scrollTo({ top: 0, behavior: 'smooth' });\n  });\n  paint();\n  if (hash === 'result') showResult();\n})();\n"],"pages/system-selector.html":[],"index.html":[]};

(function () {
  var root = document.documentElement;
  var app = document.querySelector('.app'); /* 仅用于主题/折叠的初始探测；换页后由 bindPage 重新取 */

  /* ---------- 主题：首绘前应用，避免闪一下 ---------- */
  function applyMode(mode) {
    root.setAttribute('data-mode', mode);
    try {
      localStorage.setItem('proto-mode', mode);
    } catch (e) {}
    document.querySelectorAll('[data-mode-toggle]').forEach(function (btn) {
      var dark = mode === 'dark';
      btn.setAttribute('aria-pressed', String(dark));
      btn.setAttribute('aria-label', dark ? '切换为浅色模式' : '切换为深色模式');
      btn.setAttribute('title', btn.getAttribute('aria-label'));
      btn.querySelectorAll('[data-icon]').forEach(function (ic) {
        ic.hidden = ic.getAttribute('data-icon') !== (dark ? 'moon' : 'sun');
      });
    });
  }
  document.querySelectorAll('[data-mode-toggle]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      applyMode(root.getAttribute('data-mode') === 'dark' ? 'light' : 'dark');
    });
  });
  /* 与页面 <head> 内联脚本一致：#light / #dark 强制模式优先，其次本机存储，
     最后跟随系统。否则这里会把内联脚本已经设好的模式覆盖掉（截图与评审时尤其明显）。 */
  function forcedMode() {
    var m = /(^|[,#])(light|dark)([,#]|$)/.exec(location.hash || '');
    return m && m[2];
  }
  var stored = null;
  try {
    stored = localStorage.getItem('proto-mode');
  } catch (e) {}
  applyMode(forcedMode() || stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

  /* =========================================================================
     页面级交互的绑定
     注意：这一段必须能「重复执行」。多文件版是每个 HTML 一次加载，但单文件版
     是同一个文档里反复换页 —— 换页后 .app 是新的元素，必须重新绑定。
     之前把绑定写在 IIFE 顶层，导致单文件版换页后交互全失效（文件加载时
     页面上还没有 .app，appendChild 直接抛 null），手机端表现为抽屉打不开。
     ========================================================================= */
  function bindPage() {
    var app = document.querySelector('.app'); /* 仅用于主题/折叠的初始探测；换页后由 bindPage 重新取 */
    if (!app || app.getAttribute('data-bound') === 'true') return; /* 同一元素只绑一次 */
    app.setAttribute('data-bound', 'true');

    /* ---------- 侧栏折叠（桌面） ---------- */
    var collapseBtn = app.querySelector('[data-collapse]');
    if (collapseBtn) {
      collapseBtn.addEventListener('click', function () {
        var next = app.getAttribute('data-collapsed') !== 'true';
        app.setAttribute('data-collapsed', String(next));
        collapseBtn.setAttribute('aria-expanded', String(!next));
        collapseBtn.setAttribute('aria-label', next ? '展开侧栏' : '折叠侧栏');
        collapseBtn.setAttribute('title', collapseBtn.getAttribute('aria-label'));
        collapseBtn.querySelectorAll('[data-icon]').forEach(function (ic) {
          ic.hidden = ic.getAttribute('data-icon') !== (next ? 'panel-open' : 'panel-close');
        });
      });
    }

    /* ---------- 移动端抽屉 ----------
       之前只有「汉堡打开」一条路：没有遮罩、点外部不关、换页也不重置。
       结果手机上抽屉一开就盖住全屏，且再无关闭方式，看起来像「展不开」。
       这里补齐遮罩点击、Esc、以及切页时自动收起。 */
    var scrim = document.createElement('div');
    scrim.className = 'scrim';
    scrim.hidden = true;
    scrim.setAttribute('aria-hidden', 'true');
    app.appendChild(scrim);

    function setDrawer(open) {
      app.setAttribute('data-mobile-open', String(!!open));
      scrim.hidden = !open;
      var btn = app.querySelector('[data-menu]');
      if (btn) btn.setAttribute('aria-expanded', String(!!open));
    }
    var menuBtn = app.querySelector('[data-menu]');
    if (menuBtn) {
      menuBtn.addEventListener('click', function () {
        setDrawer(app.getAttribute('data-mobile-open') !== 'true');
      });
    }
    scrim.addEventListener('click', function () { setDrawer(false); });
    /* 点任意导航项后收起 */
    app.addEventListener('click', function (ev) {
      if (ev.target.closest && ev.target.closest('.nav-link')) setDrawer(false);
    });
    setDrawer(false); /* 换页/重新渲染时重置，避免状态残留 */

    /* 供单文件版路由在换页前调用 */
    window.PROTO_SET_DRAWER = setDrawer;
  }
  window.PROTO_BIND_PAGE = bindPage;

  /* Esc 只需在 document 上绑一次 */
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && window.PROTO_SET_DRAWER) window.PROTO_SET_DRAWER(false);
  });

  /* ---------- 分段控件：组内互斥（每次换页都要重新绑） ---------- */
  function bindChips() {
    document.querySelectorAll('[data-chipgroup]').forEach(function (group) {
      if (group.getAttribute('data-bound') === 'true') return;
      group.setAttribute('data-bound', 'true');
      group.addEventListener('click', function (ev) {
        var chip = ev.target.closest('.chip');
        if (!chip || !group.contains(chip)) return;
        group.querySelectorAll('.chip').forEach(function (c) {
          c.setAttribute('aria-pressed', String(c === chip));
        });
      });
    });
  }

  /* 统一入口：初次加载与单文件版换页后都调它 */
  window.PROTO_REBIND = function () {
    bindPage();
    bindChips();
  };

  bindPage();
  bindChips();
})();


/* ============================ 路由 ============================ */
(function () {
  'use strict';
  var stage = document.getElementById('stage');
  var root = document.documentElement;

  function parseHash() {
    var raw = decodeURIComponent(location.hash.replace(/^#/, '')).replace(/^\/+/, '');
    if (!raw) return { page: BUNDLE_HOME, state: '' };
    var q = raw.indexOf('?');
    var page = q < 0 ? raw : raw.slice(0, q);
    var state = q < 0 ? '' : raw.slice(q + 1);
    /* 允许 #/?shots 这种目录内的子视图 */
    if (!page) page = BUNDLE_HOME;
    return { page: page, state: state };
  }

  function applyBody(page) {
    var m = BUNDLE_PAGES[page];
    var attrs = m ? m.bodyAttr : '';
    document.body.removeAttribute('data-surface');
    var surface = /data-surface="([^"]*)"/.exec(attrs);
    if (surface) document.body.setAttribute('data-surface', surface[1]);
  }

  function renderShots() {
    var keys = Object.keys(BUNDLE_SHOTS);
    var html = '<div class="content"><div class="content__inner">' +
      '<div class="pagehead"><div><h1>全部截图</h1>' +
      '<p class="pagehead__desc">共 ' + keys.length + ' 张，1440 宽，按文件名排序。深色模式的 4 张在最后。</p></div>' +
      '<div class="pagehead__actions"><a class="btn" href="#/' + BUNDLE_HOME + '">返回目录</a></div></div>' +
      '<div class="shotgrid">';
    keys.forEach(function (k) {
      html += '<figure><img src="' + BUNDLE_SHOTS[k] + '" alt="' + (BUNDLE_CAPTIONS[k] || k) + '" loading="lazy">' +
        '<figcaption>' + (BUNDLE_CAPTIONS[k] || k) + ' · <span class="mono">' + k + '.png</span></figcaption></figure>';
    });
    html += '</div></div></div>';
    stage.innerHTML = html;
  }

  var lastPage = null;
  function render() {
    var r = parseHash();
    var page = r.page;
    /* 兼容：允许只写文件名 */
    if (!BUNDLE_PAGES[page]) {
      var hit = Object.keys(BUNDLE_PAGES).filter(function (k) {
        return k === 'pages/' + page || k.endsWith('/' + page);
      })[0];
      if (hit) page = hit;
    }
    if (r.state === 'shots') { applyBody(BUNDLE_HOME); renderShots(); lastPage = '__shots'; return; }
    var m = BUNDLE_PAGES[page];
    if (!m) { page = BUNDLE_HOME; m = BUNDLE_PAGES[page]; }
    applyBody(page);
    /* 换页前先收起移动端抽屉：否则导航后抽屉仍盖住新页面，看起来像「点了没反应」 */
    if (window.PROTO_SET_DRAWER) window.PROTO_SET_DRAWER(false);
    stage.innerHTML = BUNDLE_CONTENT[page] || '';
    try { window.PROTO.render(); } catch (e) { console.error('外壳渲染失败', e); }
    (BUNDLE_SCRIPTS[page] || []).forEach(function (code) {
      try { new Function(code)(); } catch (e) { console.error('页面脚本执行失败', e); }
    });
    /* 换页后 .app 是新元素，必须重新绑定抽屉/折叠/分段控件，
       否则单文件版翻到第二页起交互全失效（手机端表现为抽屉打不开） */
    if (window.PROTO_REBIND) window.PROTO_REBIND();
    lastPage = page;
    window.scrollTo(0, 0);
    document.getElementById('bb-page').textContent = m.title.replace(/ · .*$/, '');
    document.title = m.title;
  }

  /* 模式：单文件版统一由这里决定，换页不再被上一次的偏好覆盖 */
  function applyMode(mode) {
    root.setAttribute('data-mode', mode);
    try { localStorage.setItem('proto-mode', mode); } catch (e) {}
    var btn = document.getElementById('bb-mode');
    if (btn) btn.textContent = mode === 'dark' ? '切换浅色' : '切换深色';
    document.querySelectorAll('[data-mode-toggle]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(mode === 'dark'));
    });
    /* 重渲染图表类内容不需要，颜色全走 CSS 变量 */
  }
  var forced = /(^|[,#?])(light|dark)([,#?]|$)/.exec(location.hash);
  var stored = null;
  try { stored = localStorage.getItem('proto-mode'); } catch (e) {}
  applyMode((forced && forced[2]) || stored || 'light');

  document.getElementById('bb-mode').addEventListener('click', function () {
    applyMode(root.getAttribute('data-mode') === 'dark' ? 'light' : 'dark');
  });
  document.getElementById('bb-home').addEventListener('click', function () { location.hash = '#/' + BUNDLE_HOME; });
  document.getElementById('bb-shots').addEventListener('click', function () { location.hash = '#/' + BUNDLE_HOME + '?shots'; });

  /* 页面内的深浅切换按钮 → 交给单文件版统一处理 */
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest && ev.target.closest('[data-mode-toggle]');
    if (!t) return;
    ev.preventDefault();
    applyMode(root.getAttribute('data-mode') === 'dark' ? 'light' : 'dark');
  }, true);

  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
