<!doctype html>
<html lang="zh-CN" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 心理筛查预警系统（原型）</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/shell.css">
<script>
try {
  var m = localStorage.getItem('proto-mode') ||
    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-mode', m);
} catch (e) {}
</script>
</head>
<body>

<!-- 没有顶栏，主题切换做成右上角浮动按钮 -->
<button class="iconbtn" type="button" data-mode-toggle aria-label="切换为深色模式" aria-pressed="false" title="切换为深色模式"
        style="position:fixed;top:16px;right:16px;z-index:30">
  <span data-icon="sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
  <span data-icon="moon" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.9 12.5A8.5 8.5 0 1 1 11.5 3.1a6.6 6.6 0 0 0 9.4 9.4Z"/></svg></span>
</button>

<div class="auth">
  <!-- 左栏：品牌与卖点（不用渐变、不用插画堆砌） -->
  <aside class="auth__aside">
    <div class="inline" style="gap:var(--sp-5)">
      <span class="brand__mark" aria-hidden="true" style="width:34px;height:34px">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h3l2.5-7 3 14 2.5-7h6"/></svg>
      </span>
      <span>
        <span style="display:block;font-size:var(--fs-title);font-weight:700">心理筛查预警系统</span>
        <span class="dim" style="font-size:var(--fs-label)">基于动态跨模态哈希检索和 RAG</span>
      </span>
    </div>

    <h1 style="font-size:1.75rem;max-width:22ch">从一次自我了解开始，<br>让关注早一点到达。</h1>

    <ul class="auth__points">
      <li>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        <span><strong>多模态采集</strong>：文字、语音、图像统一记录，量表之外的线索也留得住。</span>
      </li>
      <li>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        <span><strong>跨模态哈希检索</strong>：64 位码空间里找相似历史模式，毫秒级、可解释。</span>
      </li>
      <li>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        <span><strong>RAG 风险解释</strong>：结论有据可查，只做风险提示与转介建议，不构成诊断。</span>
      </li>
    </ul>

    <p class="dim" style="font-size:var(--fs-meta);max-width:44ch;margin:0">
      本页面为高保真原型样张，用于展示界面与主要功能，非真实系统。
    </p>
  </aside>

  <!-- 右栏：登录表单 -->
  <main class="auth__main">
    <div class="auth__form">
      <h2 style="font-size:var(--fs-h1)">登录账号</h2>
      <p class="muted" style="margin:var(--sp-3) 0 var(--sp-8);font-size:var(--fs-base)">使用学校统一发放的账号登录</p>

      <form class="stack" style="gap:var(--sp-6)" onsubmit="return false">
        <label class="field">
          <span>用户名</span>
          <input id="acct-user" type="text" value="xiaoyu" autocomplete="username">
        </label>
        <label class="field">
          <span>密码</span>
          <input id="acct-pass" type="password" value="123456" autocomplete="current-password">
        </label>

        <div class="spread">
          <label class="inline" style="gap:var(--sp-3);font-size:var(--fs-label);color:var(--txt-2);cursor:pointer">
            <input type="checkbox" checked style="width:15px;height:15px;accent-color:var(--accent)">
            记住我
          </label>
          <a href="#" style="font-size:var(--fs-label)">忘记密码？</a>
        </div>

        <button class="btn btn--primary btn--lg" type="button">登录</button>
      </form>

      <div class="inline" style="gap:var(--sp-5);margin:var(--sp-8) 0">
        <span style="flex:1;height:1px;background:var(--line)"></span>
        <span class="dim" style="font-size:var(--fs-meta)">演示账号（点击自动填充）</span>
        <span style="flex:1;height:1px;background:var(--line)"></span>
      </div>

      <div class="stack stack--tight">
        <button class="demoacct" type="button" data-acct="xiaoyu" data-pw="123456">
          <span>个人端 · 学生</span><span><code>xiaoyu / 123456</code></span>
        </button>
        <button class="demoacct" type="button" data-acct="admin" data-pw="admin123">
          <span>管理端 · 咨询师</span><span><code>admin / admin123</code></span>
        </button>
      </div>

      <p class="dim" style="font-size:var(--fs-meta);margin-top:var(--sp-8)">
        首次使用？<a href="#">创建账号</a> · 登录即表示同意
        <a href="#">数据使用说明</a>与<a href="#">隐私政策</a>
      </p>
    </div>
  </main>
</div>

<script>
/* 演示账号一键填充（原型自包含，不污染 app.js） */
document.querySelectorAll('.demoacct').forEach(function (b) {
  b.addEventListener('click', function () {
    document.getElementById('acct-user').value = b.dataset.acct;
    document.getElementById('acct-pass').value = b.dataset.pw;
  });
});
</script>
<script src="../assets/app.js"></script>
</body>
</html>
