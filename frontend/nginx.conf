# 生产入口：静态前端 + 同源反代
#   浏览器 → :80
#     /                前端 dist（SPA 回退 index.html）
#     /api/...         主业务后端 backend:8000
#     /uploads/...     主业务后端静态文件（语音、图片）
#     /personal-api/...个人端 AI 服务 personal:8001（nginx 去掉前缀）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 语音/图片上传：后端上限 50MB，这里留余量
    client_max_body_size 60m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 个人端 AI 服务：请求 /personal-api/api/v1/... → personal:8001/api/v1/...
    location /personal-api/ {
        proxy_pass http://personal:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 画像生成/长文本抽取可能跑数分钟
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        # 聊天/进度轮询按流式处理，避免 nginx 缓冲
        proxy_buffering off;
    }

    # 主业务后端（含登录、筛查、检索、管理端接口）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 上传的语音/图片由主后端静态路由提供
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # 前端路由（HashRouter 也兼容），静态资源不存在时回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存：只匹配 /assets/ 下的构建产物，
    # 避免正则 location 抢走 /uploads/ 的图片请求
    location ~* ^/assets/.*\.(js|css|png|jpg|jpeg|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
